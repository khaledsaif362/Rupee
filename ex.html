                    c.pfCode||""
                )
                .trim()
                .toUpperCase(),

            inst:c.type,
            type:c.type,

            netQty:
                item.side==="BUY"
                ?
                item.qty
                :
                -item.qty,

            side:item.side,

            /*
              THIS IS THE IMPORTANT PRICE.

              It comes from the editable Output Price.
              Initially this price is populated from SPN.
              Manual changes therefore affect Exposure.
            */
            ltp:
                Number.isFinite(
                    Number(item.price)
                )
                ?
                Number(item.price)
                :
                null,

            lotSize:1,

            strike:
                c.type==="OPT"
                ?
                c.strike
                :
                null,

            optionType:
                c.type==="OPT"
                ?
                (
                    c.optionType==="C"
                    ?
                    "CE"
                    :
                    "PE"
                )
                :
                "",

            expiry:
                exposureExpiry(
                    c.expiry
                )

        };

    });

}


/* =========================================================
   EXPOSURE AGGREGATION
========================================================= */

function aggregateExposurePositions(rows){

    const map=new Map();


    rows.forEach(r=>{

        const key=[

            String(
                r.symbol||""
            ).toUpperCase(),

            String(r.type||""),

            String(r.expiry||""),

            r.type==="OPT"
                ?
                Number(r.strike||0)
                :
                "",

            r.type==="OPT"
                ?
                String(
                    r.optionType||""
                ).toUpperCase()
                :
                ""

        ].join("|");


        if(!map.has(key)){

            map.set(
                key,
                {
                    ...r,
                    netQty:0
                }
            );

        }


        const x=
            map.get(key);


        const signed=
            (
                String(r.side)
                .toUpperCase()==="SELL"
                ?
                -1
                :
                1
            )*
            Math.abs(
                Number(r.netQty)||0
            );


        x.netQty+=signed;


        /*
          Keep the latest editable Output Price.
        */
        if(
            Number.isFinite(
                Number(r.ltp)
            )&&
            Number(r.ltp)>0
        ){

            x.ltp=
                Number(r.ltp);

        }

    });


    return Array.from(
        map.values()
    )
    .filter(
        x=>
            Math.abs(
                Number(x.netQty)||0
            )>0
    )
    .map(x=>({

        ...x,

        side:
            x.netQty>=0
            ?
            "BUY"
            :
            "SELL"

    }));

}


/* =========================================================
   EXPOSURE RATE
========================================================= */

function exposureIsIndex(symbol){

    return[
        "NIFTY",
        "BANKNIFTY",
        "FINNIFTY",
        "MIDCPNIFTY",
        "NIFTYNXT50",
        "SENSEX",
        "BANKEX",
        "SENSEX50"
    ].includes(
        String(symbol||"")
        .toUpperCase()
    );

}


function exposureUnderlyingPrice(p){

    /*
      IMPORTANT:

      We now intentionally use the editable Output Price.

      For Option SELL this Output Price was initially
      populated from the underlying SPN <p>.

      If user manually changes it, this function gets
      the changed value.
    */

    if(
        p.ltp!==null &&
        p.ltp>0
    ){

        return{

            price:p.ltp,

            source:
                "Output Price"

        };

    }


    return{

        price:null,

        source:
            "Underlying price unavailable"

    };

}


function exposureExpiryDay(p){

    const calcDate=
        getSPANCreatedDate();


    return(
        !!calcDate&&
        !!p.expiry&&
        exposureIsIndex(p.symbol)&&
        normalizeExpiry(p.expiry)===
        normalizeExpiry(calcDate)
    );

}


function findExposureRate(p){

    if(p.type==="OPT"){

        const exact=
            ael3Records.find(x=>

                x.symbol===p.symbol&&
                x.expiry===p.expiry&&
                Number(x.strike)===
                    Number(p.strike)&&
                x.optionType===
                    p.optionType

            );


        if(exact){

            let rate=
                exact.rate;


            if(
                exposureExpiryDay(p)&&
                exposureIsIndex(p.symbol)
            ){

                rate+=2;

            }


            return{

                rate,

                source:
                    "AEL File 3"+
                    (
                        rate!==exact.rate
                        ?
                        " + Expiry Day 2%"
                        :
                        ""
                    ),

                reason:
                    "Exact option contract"

            };

        }


        const e=
            ael2Records.filter(x=>

                x.symbol===p.symbol&&
                x.expiry===p.expiry

            );


        if(e.length){

            const underlying=
                exposureUnderlyingPrice(p);

            let selected=null;


            if(
                underlying.price!==null&&
                p.strike!==null
            ){

                const threshold=
                    exposureIsIndex(p.symbol)
                    ?
                    underlying.price*0.10
                    :
                    underlying.price*0.30;


                const isDeepOTM=
                    p.optionType==="CE"
                    ?
                    p.strike>
                    underlying.price+
                    threshold
                    :
                    p.strike<
                    underlying.price-
                    threshold;


                if(isDeepOTM){

                    selected=
                        e.find(
                            x=>
                                x.instrument==="OTM"
                        );

                }

            }


            selected=
                selected||
                e.find(
                    x=>
                        x.instrument==="OTH"
                )||
                e[0];


            let rate=
                selected.rate;


            if(
                exposureExpiryDay(p)&&
                exposureIsIndex(p.symbol)
            ){

                rate+=2;

            }


            return{

                rate,

                source:
                    "AEL File 2"+
                    (
                        rate!==selected.rate
                        ?
                        " + Expiry Day 2%"
                        :
                        ""
                    ),

                reason:
                    "Symbol + expiry ("+
                    selected.instrument+
                    ")"

            };

        }


        const b=
            ael1Records.filter(
                x=>
                    x.symbol===p.symbol
            );


        if(b.length){

            const underlying=
                exposureUnderlyingPrice(p);

            let selected=null;


            if(
                underlying.price!==null&&
                p.strike!==null
            ){

                const threshold=
                    exposureIsIndex(p.symbol)
                    ?
                    underlying.price*0.10
                    :
                    underlying.price*0.30;


                const isDeepOTM=
                    p.optionType==="CE"
                    ?
                    p.strike>
                    underlying.price+
                    threshold
                    :
                    p.strike<
                    underlying.price-
                    threshold;


                if(isDeepOTM){

                    selected=
                        b.find(
                            x=>
                                x.instrument==="OTM"
                        );

                }

            }


            selected=
                selected||
                b.find(
                    x=>
                        x.instrument==="OTH"
                )||
                b[0];


            let rate=
                selected.rate;


            if(
                exposureExpiryDay(p)&&
                exposureIsIndex(p.symbol)
            ){

                rate+=2;

            }


            return{

                rate,

                source:
                    "AEL File 1"+
                    (
                        rate!==selected.rate
                        ?
                        " + Expiry Day 2%"
                        :
                        ""
                    ),

                reason:
                    "Symbol fallback ("+
                    selected.instrument+
                    ")"

            };

        }


        return null;

    }


    /*
      Futures
    */

    const f=
        ael1Records.find(
            x=>
                x.symbol===p.symbol&&
                x.instrument==="OTH"
        );


    if(f){

        return{

            rate:f.rate,

            source:
                "AEL File 1",

            reason:
                "Applicable futures ELM"

        };

    }


    const index=
        exposureIsIndex(
            p.symbol
        );


    return{

        rate:
            index
            ?
            2
            :
            3.5,

        source:
            "NSE default",

        reason:
            index
            ?
            "Index derivatives 2%"
            :
            "Stock derivatives 3.5%"

    };

}


/* =========================================================
   MERGED EXPOSURE
========================================================= */

function getMergedExposureMap(){

    const rows=
        calculateExposureRows();

    const map={};


    rows.forEach(r=>{

        const p=r.p;


        const key=
            String(
                p.symbol||""
            ).toUpperCase()+
            "|"+
            p.type+
            "|"+
            exposureExpiry(p.expiry)+
            "|"+
            (
                p.type==="OPT"
                ?
                Number(p.strike)
                :
                ""
            )+
            "|"+
            (
                p.type==="OPT"
                ?
                String(
                    p.optionType||""
                ).toUpperCase()
                :
                ""
            );


        if(!map[key]){

            map[key]={

                exposure:0,

                missing:false,

                rate:r.rate,

                source:r.source,

                basis:r.basis

            };

        }


        if(r.exposure===null){

            map[key].missing=true;

        }else{

            map[key].exposure+=
                Number(r.exposure)||0;

        }

    });


    return map;

}


function mergedExposureForItem(
    item,
    exposureMap
){

    const c=
        item.contract;


    const key=
        String(
            c.pfCode||""
        )
        .trim()
        .toUpperCase()+
        "|"+
        c.type+
        "|"+
        exposureExpiry(c.expiry)+
        "|"+
        (
            c.type==="OPT"
            ?
            Number(c.strike)
            :
            ""
        )+
        "|"+
        (
            c.type==="OPT"
            ?
            (
                c.optionType==="C"
                ?
                "CE"
                :
                "PE"
            )
            :
            ""
        );


    return(
        exposureMap[key]
        ||
        {
            exposure:0,
            missing:false,
            rate:null,
            source:"Not available",
            basis:"-"
        }
    );

}


/* =========================================================
   EDITABLE OUTPUT PRICE
========================================================= */

function updateMergedPrice(
    index,
    value
){

    if(!portfolio[index])
        return;


    const text=
        String(value).trim();


    const n=
        text===""
        ?
        null
        :
        Number(text);


    portfolio[index].price=
        n!==null&&
        Number.isFinite(n)&&
        n>=0
        ?
        n
        :
        null;


    /*
      IMPORTANT:

      Rebuild calculation immediately.

      Therefore:
          manual Output Price
               ↓
          Exposure
               ↓
          Total Margin
    */

    buildCalculation();

}


/* =========================================================
   EXPOSURE CALCULATION
========================================================= */

function calculateExposureRows(){

    const rows=
        aggregateExposurePositions(
            getExposurePositionRows()
        );


    const futures=
        rows.filter(
            x=>x.type==="FUT"
        );


    const options=
        rows.filter(
            x=>x.type==="OPT"
        );


    const used={};

    const result=[];


    /*
      Calendar spread futures
    */

    for(
        let i=0;
        i<futures.length;
        i++
    ){

        for(
            let j=i+1;
            j<futures.length;
            j++
        ){

            const a=futures[i];
            const b=futures[j];


            if(
                a.symbol!==b.symbol||
                a.side===b.side||
                !a.expiry||
                !b.expiry||
                a.expiry===b.expiry
            )
                continue;


            const near=
                Number(a.expiry)<
                Number(b.expiry)
                ?
                a
                :
                b;


            const far=
                near===a
                ?
                b
                :
                a;


            const ua=
                used[i]||0;

            const ub=
                used[j]||0;


            const ra=
                Math.abs(a.netQty)-ua;

            const rb=
                Math.abs(b.netQty)-ub;


            if(
                ra<=0||
                rb<=0
            )
                continue;


            const matched=
                Math.min(
                    ra,
                    rb
                );


            used[i]=
                ua+matched;

            used[j]=
                ub+matched;


            const rate=
                findExposureRate(
                    far
                );


            /*
              FUT price comes from Output Price.
              Output Price initially came from SPN.
              Manual edit is therefore respected.
            */

            const price=
                far.ltp!==null&&
                far.ltp>0
                ?
                far.ltp
                :
                null;


            const value=
                price===null
                ?
                null
                :
                price*matched;


            const exposure=
                value===null
                ?
                null
                :
                value*
                (
                    rate.rate/100
                )/3;


            result.push({

                p:far,

                qty:matched,

                rate:rate.rate,

                source:rate.source,

                basis:"1/3 Far Month",

                exposure,

                reason:
                    "Calendar spread "+
                    formatExpiry(
                        near.expiry
                    )+
                    " / "+
                    formatExpiry(
                        far.expiry
                    )

            });

        }

    }


    futures.forEach(
        (p,index)=>{

            const remaining=
                Math.abs(p.netQty)-
                (used[index]||0);


            if(remaining<=0)
                return;


            const rate=
                findExposureRate(p);


            const price=
                p.ltp!==null&&
                p.ltp>0
                ?
                p.ltp
                :
                null;


            const value=
                price===null
                ?
                null
                :
                price*remaining;


            const exposure=
                value===null
                ?
                null
                :
                value*
                (
                    rate.rate/100
                );


            result.push({

                p,

                qty:remaining,

                rate:rate.rate,

                source:rate.source,

                basis:"Full",

                exposure,

                reason:
                    "Normal futures ELM"

            });

        }
    );


    /*
      OPTIONS
    */

    options.forEach(p=>{

        /*
          OPTION BUY = ZERO EXPOSURE
        */

        if(p.netQty>0){

            result.push({

                p,

                qty:
                    Math.abs(
                        p.netQty
                    ),

                rate:0,

                source:
                    "NSE rule",

                basis:"0%",

                exposure:0,

                reason:
                    "Long option — no ELM"

            });

            return;

        }


        /*
          OPTION SELL
        */

        const rate=
            findExposureRate(p);


        if(!rate){

            result.push({

                p,

                qty:
                    Math.abs(
                        p.netQty
                    ),

                rate:null,

                source:
                    "Not Found",

                basis:"-",

                exposure:null,

                reason:
                    "No matching AEL rate"

            });

            return;

        }


        /*
          IMPORTANT:

          p.ltp is the Output Price.

          For a short option:
              initial Output Price =
              underlying SPN <p>

          If user edits Output Price:
              edited price is used here.
        */

        const underlying=
            exposureUnderlyingPrice(p);


        if(
            underlying.price===null||
            underlying.price<=0
        ){

            result.push({

                p,

                qty:
                    Math.abs(
                        p.netQty
                    ),

                rate:rate.rate,

                source:rate.source,

                basis:"Full",

                exposure:null,

                reason:
                    "PRICE NOT AVAILABLE — enter underlying price in Output"

            });

            return;

        }


        /*
          Net Qty is already the underlying quantity
          represented by the option position.

          DO NOT multiply by lot size.
        */

        const notional=
            underlying.price*
            Math.abs(
                p.netQty
            );


        const exposure=
            notional*
            (
                rate.rate/100
            );


        result.push({

            p,

            qty:
                Math.abs(
                    p.netQty
                ),

            rate:rate.rate,

            source:rate.source,

            basis:"Full",

            exposure,

            reason:
                "Short option — full ELM; Output Price "+
                underlying.price

        });

    });


    return result;

}

/* =========================================================
   XML HELPERS
========================================================= */

function directValue(
    parent,
    tag
){

    const node=
        parent.querySelector(
            ":scope > "+tag
        );


    return node
        ?
        node.textContent.trim()
        :
        "";

}


function directNumber(
    parent,
    tag
){

    const v=
        directValue(
            parent,
            tag
        );


    if(v==="")
        return null;


    const n=
        Number(v);


    return Number.isFinite(n)
        ?
        n
        :
        null;

}


function riskArray(node){

    const ra=
        node.querySelector(
            ":scope > ra"
        );


    if(!ra)
        return[];


    return Array.from(
        ra.querySelectorAll(
            ":scope > a"
        )
    )
    .map(
        x=>
            Number(
                x.textContent.trim()
            )||0
    );

}


/* =========================================================
   PARSE SPN
========================================================= */

async function parseSPAN(
    onProgress
){

    contracts=[];

    const seen=
        new Set();


    const futPfs=
        Array.from(
            spanXML.querySelectorAll(
                "futPf"
            )
        );


    const optPfs=
        Array.from(
            spanXML.querySelectorAll(
                "oopPf"
            )
        );


    const totalGroups=
        futPfs.length+
        optPfs.length;


    let doneGroups=0;


    const report=()=>{

        const pct=
            totalGroups
            ?
            40+
            Math.round(
                (
                    doneGroups/
                    totalGroups
                )*60
            )
            :
            100;


        if(
            typeof onProgress==="function"
        )
            onProgress(
                Math.min(
                    100,
                    pct
                )
            );

    };


    /*
      FUTURES
    */

    for(
        const pf of futPfs
    ){

        const pfCode=
            directValue(
                pf,
                "pfCode"
            );


        const pfId=
            directValue(
                pf,
                "pfId"
            );


        pf.querySelectorAll(
            ":scope > fut"
        )
        .forEach(fut=>{

            const cId=
                directValue(
                    fut,
                    "cId"
                );


            const expiry=
                directValue(
                    fut,
                    "pe"
                );


            const key=
                "FUT|"+
                pfId+
                "|"+
                cId+
                "|"+
                expiry;


            if(seen.has(key))
                return;


            seen.add(key);


            contracts.push({

                type:"FUT",

                pfCode,

                pfId,

                contractId:cId,

                expiry,

                strike:null,

                optionType:"",

                /*
                  SPN <p>
                  becomes the default Output Price.
                */
                price:
                    directNumber(
                        fut,
                        "p"
                    ),

                delta:
                    directNumber(
                        fut,
                        "d"
                    ),

                spanDelta:(()=>{

                    const ra=
                        fut.querySelector(
                            ":scope > ra"
                        );


                    const d=
                        ra
                        ?
                        ra.querySelector(
                            ":scope > d"
                        )
                        :
                        null;


                    const n=
                        d
                        ?
                        Number(
                            d.textContent.trim()
                        )
                        :
                        NaN;


                    return Number.isFinite(n)
                        ?
                        n
                        :
                        null;

                })(),

                volatility:
                    directNumber(
                        fut,
                        "v"
                    ),

                cvf:
                    directNumber(
                        fut,
                        "cvf"
                    )??1,

                scaling:
                    directNumber(
                        fut,
                        "sc"
                    )??1,

                risk:
                    riskArray(fut)

            });

        });


        doneGroups++;

        report();

        await new Promise(
            requestAnimationFrame
        );

    }


    /*
      OPTIONS
    */

    for(
        const pf of optPfs
    ){

        const pfCode=
            directValue(
                pf,
                "pfCode"
            );


        const pfId=
            directValue(
                pf,
                "pfId"
            );


        pf.querySelectorAll(
            ":scope > series"
        )
        .forEach(series=>{

            const expiry=
                directValue(
                    series,
                    "pe"
                );


            /*
              NEW:

              Read the underlying reference
              from the option SERIES.

              Example:
                  <undC>
                      <pfId>487</pfId>
                      <cId>1</cId>
                  </undC>
            */

            const undC=
                series.querySelector(
                    ":scope > undC"
                );


            const underlyingPfId=
                undC
                ?
                directValue(
                    undC,
                    "pfId"
                )
                :
                null;


            const underlyingContractId=
                undC
                ?
                directValue(
                    undC,
                    "cId"
                )
                :
                null;


            series.querySelectorAll(
                ":scope > opt"
            )
            .forEach(opt=>{

                const cId=
                    directValue(
                        opt,
                        "cId"
                    );


                const optionType=
                    directValue(
                        opt,
                        "o"
                    ).toUpperCase();


                const strike=
                    directNumber(
                        opt,
                        "k"
                    );


                const key=
                    "OPT|"+
                    pfId+
                    "|"+
                    cId+
                    "|"+
                    expiry+
                    "|"+
                    optionType+
                    "|"+
                    strike;


                if(seen.has(key))
                    return;


                seen.add(key);


                contracts.push({

                    type:"OPT",

                    pfCode,

                    pfId,

                    contractId:cId,

                    expiry,

                    strike,

                    optionType,

                    /*
                      This remains the OPTION premium.

                      For BUY:
                          it becomes default Output Price.

                      For SELL:
                          we later replace the Output Price
                          with underlying SPN <p>.
                    */
                    price:
                        directNumber(
                            opt,
                            "p"
                        ),

                    /*
                      NEW UNDERLYING IDENTIFIERS
                    */
                    underlyingPfId,

                    underlyingContractId,

                    underlyingContract:null,

                    underlyingPrice:null,

                    delta:
                        directNumber(
                            opt,
                            "d"
                        ),

                    spanDelta:(()=>{

                        const ra=
                            opt.querySelector(
                                ":scope > ra"
                            );


                        const d=
                            ra
                            ?
                            ra.querySelector(
                                ":scope > d"
                            )
                            :
                            null;


                        const n=
                            d
                            ?
                            Number(
                                d.textContent.trim()
                            )
                            :
                            NaN;


                        return Number.isFinite(n)
                            ?
                            n
                            :
                            null;

                    })(),

                    volatility:
                        directNumber(
                            opt,
                            "v"
                        ),

                    cvf:
                        directNumber(
                            series,
                            "cvf"
                        )??
                        directNumber(
                            pf,
                            "cvf"
                        )??
                        1,

                    scaling:
                        directNumber(
                            series,
                            "sc"
                        )??1,

                    risk:
                        riskArray(opt)

                });

            });

        });


        doneGroups++;

        report();

        await new Promise(
            requestAnimationFrame
        );

    }


    if(
        typeof onProgress==="function"
    )
        onProgress(100);

}


/* =========================================================
   DATE
========================================================= */

function normalizeExpiry(value){

    if(!value)
        return"";


    value=
        String(value)
        .trim()
        .toUpperCase();


    if(/^\d{8}$/.test(value))
        return value;


    if(
        /^\d{4}-\d{2}-\d{2}$/
        .test(value)
    )
        return value.replace(
            /-/g,
            ""
        );


    const months={

        JAN:"01",
        FEB:"02",
        MAR:"03",
        APR:"04",
        MAY:"05",
        JUN:"06",
        JUL:"07",
        AUG:"08",
        SEP:"09",
        OCT:"10",
        NOV:"11",
        DEC:"12"

    };


    let m=
        value.match(
            /^(\d{1,2})[-\/]([A-Z]{3})[-\/](\d{4})$/
        );


    if(
        m&&
        months[m[2]]
    ){

        return(
            m[3]+
            months[m[2]]+
            m[1].padStart(2,"0")
        );

    }


    m=
        value.match(
            /^(\d{1,2})([A-Z]{3})(\d{4})$/
        );


    if(
        m&&
        months[m[2]]
    ){

        return(
            m[3]+
            months[m[2]]+
            m[1].padStart(2,"0")
        );

    }


    return value;

}


function formatExpiry(value){

    const d=
        normalizeExpiry(value);


    if(!/^\d{8}$/.test(d))
        return value||"-";


    const months=[
        "Jan","Feb","Mar","Apr",
        "May","Jun","Jul","Aug",
        "Sep","Oct","Nov","Dec"
    ];


    return(
        d.substring(6,8)+
        "-"+
        months[
            Number(
                d.substring(4,6)
            )-1
        ]+
        "-"+
        d.substring(0,4)
    );

}

function searchContracts(){

    if(!contracts.length){

        setStatus(
            "Please upload an SPN file first.",
            "err"
        );

        return;

    }


    const symbol=
        document
        .getElementById("symbol")
        .value
        .trim()
        .toUpperCase();


    const type=
        document
        .getElementById("contractType")
        .value;


    const expiry=
        normalizeExpiry(
            document
            .getElementById("expiry")
            .value
        );


    const strikeText=
        document
        .getElementById("strike")
        .value
        .trim();


    const strike=
        strikeText===""
        ?
        null
        :
        Number(strikeText);


    const optionType=
        document
        .getElementById("optionType")
        .value
        .trim()
        .toUpperCase();


    const results=
        contracts.filter(c=>{

            if(
                symbol&&
                String(c.pfCode)
                .toUpperCase()!==symbol
            )
                return false;


            if(
                type!=="ALL"&&
                c.type!==type
            )
                return false;


            if(
                expiry&&
                normalizeExpiry(c.expiry)!==
                expiry
            )
                return false;


            if(c.type==="OPT"){

                if(
                    strike!==null&&
                    Number(c.strike)!==
                    strike
                )
                    return false;


                if(
                    optionType&&
                    c.optionType!==
                    optionType
                )
                    return false;

            }


            return true;

        });


    displayResults(results);

}

/* =========================================================
   MAIN SPAN CALCULATION
========================================================= */

function buildCalculation(){

    const head=
        document.getElementById(
            "calculationHead"
        );


    const body=
        document.getElementById(
            "calculationBody"
        );


    head.innerHTML=`

        <tr>

            <th>#</th>

            <th class="left">
                Scrip / Contract
            </th>

            <th>Type</th>

            <th>Expiry</th>

            <th>Strike</th>

            <th>CE/PE</th>

            <th>Side</th>

            <th>Qty</th>

            <th>Price</th>

            <th>SPAN</th>

            <th>Exposure</th>

            <th>Total Margin</th>

            <th>Remove</th>

        </tr>

    `;


    body.innerHTML="";


    const contractScenarioValues=[];

    let netOptionValueAdjustment=0;


    portfolio.forEach(
        (item,index)=>{

            const c=
                item.contract;


            const direction=
                item.side==="BUY"
                ?
                1
                :
                -1;


            const qty=
                Math.max(
                    0,
                    Number(item.qty)||0
                );


            const multiplier=
                (
                    Number(c.cvf)||1
                )*
                (
                    Number(c.scaling)||1
                );


            const values=[];


            for(
                let scenario=0;
                scenario<16;
                scenario++
            ){

                const raw=
                    Number(
                        c.risk[scenario]||0
                    );


                values.push(
                    raw*
                    qty*
                    direction*
                    multiplier
                );

            }


            contractScenarioValues
                .push(values);


            if(c.type==="OPT"){

                const premium=
                    (
                        Number(c.price)||0
                    )*
                    qty*
                    multiplier;


                netOptionValueAdjustment+=
                    item.side==="SELL"
                    ?
                    premium
                    :
                    -premium;

            }

        }
    );


    const groups={};


    portfolio.forEach(
        (item,index)=>{

            const c=
                item.contract;


            const groupKey=
                String(
                    c.pfCode||""
                )
                .trim()
                .toUpperCase();


            if(!groups[groupKey]){

                groups[groupKey]={

                    key:groupKey,

                    totals:
                        new Array(16)
                        .fill(0),

                    members:[]

                };

            }


            groups[groupKey]
                .members
                .push(index);


            for(
                let scenario=0;
                scenario<16;
                scenario++
            ){

                groups[groupKey]
                    .totals[scenario]+=
                    contractScenarioValues[
                        index
                    ][scenario];

            }

        }
    );


    let scanningRisk=0;

    const groupWorst={};


    Object.values(groups)
    .forEach(group=>{

        const worst=
            Math.max(
                ...group.totals
            );


        const worstIndex=
            group.totals.indexOf(
                worst
            );


        groupWorst[group.key]={

            risk:worst,

            scenario:worstIndex

        };


        scanningRisk+=worst;

    });


    const exposureMap=
        getMergedExposureMap();


    let totalExposure=0;


    portfolio.forEach(
        (item,index)=>{

            const c=
                item.contract;


            const groupKey=
                String(
                    c.pfCode||""
                )
                .trim()
                .toUpperCase();


            const group=
                groupWorst[groupKey];


            const contribution=
                contractScenarioValues[index]
                [group.scenario];


            const standaloneSpan=
                Math.max(
                    ...contractScenarioValues[index],
                    0
                );


            const exp=
                mergedExposureForItem(
                    item,
                    exposureMap
                );


            const exposure=
                exp.missing
                ?
                null
                :
                Number(exp.exposure)||0;


            if(exposure!==null)
                totalExposure+=exposure;


            const totalMargin=
                exposure===null
                ?
                null
                :
                Number(standaloneSpan)+
                exposure;


            const priceValue=
                Number.isFinite(
                    Number(item.price)
                )
                ?
                Number(item.price)
                :
                "";


            body.insertAdjacentHTML(
                "beforeend",
                `

                <tr>

                    <td>
                        ${index+1}
                    </td>


                    <td class="left">

                        <b>
                            ${escapeHtml(c.pfCode)}
                        </b>

                    </td>


                    <td>
                        ${c.type}
                    </td>


                    <td>
                        ${formatExpiry(c.expiry)}
                    </td>


                    <td>
                        ${
                            c.type==="OPT"
                            ?
                            formatNumber(c.strike)
                            :
                            "-"
                        }
                    </td>


                    <td>
                        ${
                            c.type==="OPT"
                            ?
                            (
                                c.optionType==="C"
                                ?
                                "CE"
                                :
                                "PE"
                            )
                            :
                            "-"
                        }
                    </td>


                    <td>

                        <select
                            class="side"
                            onchange="changeSide(${index},this.value)"
                        >

                            <option
                                value="BUY"
                                ${
                                    item.side==="BUY"
                                    ?
                                    "selected"
                                    :
                                    ""
                                }
                            >
                                BUY
                            </option>

                            <option
                                value="SELL"
                                ${
                                    item.side==="SELL"
                                    ?
                                    "selected"
                                    :
                                    ""
                                }
                            >
                                SELL
                            </option>

                        </select>

                    </td>


                    <td>

                        <input
                            class="qty"
                            type="number"
                            min="1"
                            value="${item.qty}"
                            onchange="changeQty(${index},this.value)"
                        >

                    </td>


                    <td>

                        <input
                            class="qty merged-price"
                            type="number"
                            min="0"
                            step="0.01"
                            value="${priceValue}"
                            placeholder="Price"
                            onchange="updateMergedPrice(${index},this.value)"
                        >

                    </td>


                    <td class="margin-value">

                        ₹${formatNumber(standaloneSpan)}

                    </td>


                    <td
                        class="${
                            exposure===null
                            ?
                            "exposure-missing"
                            :
                            "exposure-value"
                        }"
                    >

                        ${
                            exposure===null
                            ?
                            "ENTER PRICE"
                            :
                            "₹"+
                            formatNumber(
                                exposure
                            )
                        }

                    </td>


                    <td
                        class="${
                            totalMargin===null
                            ?
                            "exposure-missing"
                            :
                            "grand-total-value"
                        }"
                    >

                        ${
                            totalMargin===null
                            ?
                            "-"
                            :
                            "₹"+
                            formatNumber(
                                totalMargin
                            )
                        }

                    </td>


                    <td>

                        <button
                            class="remove"
                            onclick="removeContract(${index})"
                        >
                            ×
                        </button>

                    </td>

                </tr>

                `
            );

        }
    );


    const spreadResult=
        calculateCalendarSpreadCharge();


    const spreadCharge=
        spreadResult.charge;


    const finalSpan=
        scanningRisk+
        spreadCharge+
        netOptionValueAdjustment;


    let grossIndividualSpan=0;


    portfolio.forEach(
        (item,index)=>{

            grossIndividualSpan+=
                Math.max(
                    ...contractScenarioValues[index],
                    0
                );

        }
    );


    grossIndividualSpan=
        Math.max(
            0,
            grossIndividualSpan
        );


    const hedgeBenefit=
        Math.max(
            0,
            grossIndividualSpan-
            finalSpan
        );


    const totalMargin=
        finalSpan+
        totalExposure;


    const grossExposure=
        Number(totalExposure)||0;


    const grossTotalMargin=
        grossIndividualSpan+
        grossExposure;


    const displayHedgeBenefit=
        Math.max(
            0,
            grossIndividualSpan-
            finalSpan
        );


    const displayTotalNetMargin=
        finalSpan+
        grossExposure;


    body.insertAdjacentHTML(
        "beforeend",
        `

        <tr class="margin-summary-row gross-span-row excel-summary-row">

            <td
                colspan="9"
                class="excel-summary-label"
            >
                GROSS
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    grossIndividualSpan
                )}
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    grossExposure
                )}
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    grossTotalMargin
                )}
            </td>

            <td></td>

        </tr>


        <tr class="margin-summary-row hedge-row excel-summary-row">

            <td
                colspan="9"
                class="excel-summary-label"
            >
                (-) HEDGE BENEFIT
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    displayHedgeBenefit
                )}
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    displayHedgeBenefit
                )}
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    displayHedgeBenefit
                )}
            </td>

            <td></td>

        </tr>


        <tr class="margin-summary-row combined-total-row excel-summary-row">

            <td
                colspan="9"
                class="excel-summary-label"
            >
                TOTAL NET MARGIN
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    finalSpan
                )}
            </td>

            <td class="margin-summary-value">
                ₹${formatNumber(
                    grossExposure
                )}
            </td>

            <td class="margin-summary-value combined-value">
                ₹${formatNumber(
                    displayTotalNetMargin
                )}
            </td>

            <td></td>

        </tr>

        `
    );


    renderSummary(

        scanningRisk,

        null,

        netOptionValueAdjustment,

        spreadCharge,

        finalSpan,

        spreadResult.details,

        spreadResult.monthDeltas

    );

}


/* =========================================================
   CALENDAR SPREAD
========================================================= */

function getRateValue(parent){

    const rate=
        parent.querySelector(
            ":scope > rate"
        );


    if(!rate)
        return 0;


    const val=
        rate.querySelector(
            ":scope > val"
        );


    if(val){

        const n=
            Number(
                val.textContent.trim()
            );


        if(
            Number.isFinite(n)
        )
            return n;

    }


    const n=
        Number(
            rate.textContent.trim()
        );


    return Number.isFinite(n)
        ?
        n
        :
        0;

}


function readSpreadLeg(leg){

    if(!leg)
        return null;


    const code=
        directValue(leg,"cc")||
        directValue(leg,"pfCode")||
        directValue(leg,"pCode")||
        "";


    const expiry=
        directValue(leg,"pe")||
        directValue(leg,"expiry")||
        "";


    const ratio=
        directNumber(leg,"i")??
        directNumber(leg,"qty")??
        directNumber(leg,"ratio")??
        1;


    return{

        code:
            String(code)
            .trim()
            .toUpperCase(),

        expiry:
            normalizeExpiry(expiry),

        ratio:
            Math.abs(
                Number(ratio)||1
            )

    };

}


function buildCalendarDeltaBook(){

    const map={};


    portfolio.forEach(item=>{

        const c=
            item.contract;


        const code=
            String(
                c.pfCode||""
            )
            .trim()
            .toUpperCase();


        const expiry=
            normalizeExpiry(
                c.expiry
            );


        if(!code||!expiry)
            return;


        const qty=
            Math.max(
                0,
                Number(item.qty)||0
            );


        if(!qty)
            return;


        const signedQty=
            (
                item.side==="BUY"
                ?
                1
                :
                -1
            )*
            qty;


        let delta;


        if(c.type==="FUT"){

            delta=
                Number.isFinite(
                    Number(c.spanDelta)
                )
                ?
                Number(c.spanDelta)
                :
                1;

        }else{

            delta=
                Number(
                    c.spanDelta
                );


            if(
                !Number.isFinite(delta)
            )
                delta=0;

        }


        const contribution=
            signedQty*
            delta;


        const key=
            code+
            "|"+
            expiry;


        if(!map[key]){

            map[key]={

                key,

                code,

                expiry,

                delta:0,

                members:[]

            };

        }


        map[key].delta+=
            contribution;


        map[key]
            .members
            .push({

                type:c.type,

                contractId:c.contractId,

                strike:c.strike,

                optionType:c.optionType,

                side:item.side,

                qty,

                compositeDelta:delta,

                contribution

            });

    });


    return map;

}


function getSPANCreatedDate(){

    if(!spanXML)
        return"";


    const created=
        directValue(
            spanXML.documentElement||
            spanXML,
            "created"
        );


    if(
        /^\d{8}/.test(created)
    )
        return created.substring(0,8);


    return"";

}


function isIndexUnderlying(code){

    const c=
        String(code||"")
        .trim()
        .toUpperCase();


    return[

        "NIFTY",
        "BANKNIFTY",
        "FINNIFTY",
        "MIDCPNIFTY",
        "NIFTYNXT50",
        "NIFTYFPI",
        "SENSEX",
        "BANKEX",
        "SENSEX50"

    ].includes(c);

}


function isCalendarSpreadAllowed(
    code,
    nearExpiry
){

    const calcDate=
        getSPANCreatedDate();


    if(
        !calcDate||
        !nearExpiry
    )
        return true;


    if(
        isIndexUnderlying(code)
    ){

        return(
            nearExpiry!==calcDate
        );

    }


    return(
        Number(nearExpiry)>=
        Number(calcDate)
    );

}


function getCalendarSpreadDefinitions(){

    if(!spanXML)
        return[];


    const result=[];

    const seen=
        new Set();


    spanXML
    .querySelectorAll(
        "dSpread"
    )
    .forEach(ds=>{

        const legs=
            Array.from(
                ds.querySelectorAll(
                    ":scope > pLeg"
                )
            );


        if(legs.length<2)
            return;


        const rate=
            getRateValue(ds);


        if(
            !Number.isFinite(rate)||
            rate<=0
        )
            return;


        for(
            let i=0;
            i<legs.length-1;
            i++
        ){

            const a=
                readSpreadLeg(
                    legs[i]
                );


            const b=
                readSpreadLeg(
                    legs[i+1]
                );


            if(
                !a||
                !b||
                !a.code||
                !b.code||
                !a.expiry||
                !b.expiry
            )
                return;


            if(a.code!==b.code)
                return;


            if(
                a.expiry===b.expiry
            )
                return;


            let near=a;
            let far=b;


            if(
                Number(near.expiry)>
                Number(far.expiry)
            ){

                near=b;
                far=a;

            }


            const key=
                near.code+
                "|"+
                near.expiry+
                "|"+
                far.expiry+
                "|"+
                near.ratio+
                "|"+
                far.ratio+
                "|"+
                rate;


            if(seen.has(key))
                continue;


            seen.add(key);


            result.push({

                code:near.code,

                near,

                far,

                keyNear:
                    near.code+
                    "|"+
                    near.expiry,

                keyFar:
                    far.code+
                    "|"+
                    far.expiry,

                rate,

                ratioNear:
                    near.ratio,

                ratioFar:
                    far.ratio

            });

        }

    });


    result.sort(
        (x,y)=>{

            const dx=
                Number(x.far.expiry)-
                Number(x.near.expiry);


            const dy=
                Number(y.far.expiry)-
                Number(y.near.expiry);


            if(dx!==dy)
                return dx-dy;


            if(
                x.near.expiry!==
                y.near.expiry
            ){

                return(
                    Number(x.near.expiry)-
                    Number(y.near.expiry)
                );

            }


            return(
                Number(x.far.expiry)-
                Number(y.far.expiry)
            );

        }
    );


    return result;

}


function calculateCalendarSpreadCharge(){

    if(
        !spanXML||
        portfolio.length<2
    ){

        return{

            charge:0,

            details:[],

            monthDeltas:[]

        };

    }


    const monthMap=
        buildCalendarDeltaBook();


    const definitions=
        getCalendarSpreadDefinitions();


    const remaining={};


    Object.keys(monthMap)
    .forEach(key=>{

        remaining[key]=
            monthMap[key].delta;

    });


    const monthDeltas=
        Object.values(monthMap)
        .sort((a,b)=>{

            if(
                a.code!==b.code
            )
                return a.code.localeCompare(
                    b.code
                );


            return(
                Number(a.expiry)-
                Number(b.expiry)
            );

        })
        .map(x=>({

            code:x.code,

            expiry:x.expiry,

            delta:x.delta

        }));


    let charge=0;

    const details=[];


    definitions.forEach(sp=>{

        const near=
            monthMap[
                sp.keyNear
            ];


        const far=
            monthMap[
                sp.keyFar
            ];


        if(!near||!far)
            return;


        if(
            !isCalendarSpreadAllowed(
                sp.code,
                sp.near.expiry
            )
        )
            return;


        let qNear=
            remaining[
                sp.keyNear
            ]||0;


        let qFar=
            remaining[
                sp.keyFar
            ]||0;


        if(
            Math.abs(qNear)<1e-12||
            Math.abs(qFar)<1e-12
        )
            return;


        if(
            Math.sign(qNear)===
            Math.sign(qFar)
        )
            return;


        const spreadUnits=
            Math.min(

                Math.abs(qNear)/
                sp.ratioNear,

                Math.abs(qFar)/
                sp.ratioFar

            );


        if(
            !Number.isFinite(
                spreadUnits
            )||
            spreadUnits<=1e-12
        )
            return;


        const usedNear=
            spreadUnits*
            sp.ratioNear*
            Math.sign(qNear);


        const usedFar=
            spreadUnits*
            sp.ratioFar*
            Math.sign(qFar);


        remaining[sp.keyNear]-=
            usedNear;


        remaining[sp.keyFar]-=
            usedFar;


        const amount=
            spreadUnits*
            sp.rate;


        charge+=amount;


        details.push({

            code:sp.code,

            expiryA:
                formatExpiry(
                    sp.near.expiry
                ),

            expiryB:
                formatExpiry(
                    sp.far.expiry
                ),

            nearDelta:qNear,

            farDelta:qFar,

            spreadDelta:
                spreadUnits,

            rate:sp.rate,

            amount

        });

    });


    return{

        charge,

        details,

        monthDeltas

    };

}

   SUMMARY
========================================================= */

function renderSummary(

    scanningRisk,

    worstIndex,

    netOptionValue,

    spreadCharge,

    finalSpan,

    spreadDetails,

    monthDeltas=[]

){

    const rows=
        portfolio.map(
            (item,index)=>{

                const c=
                    item.contract;


                const direction=
                    item.side==="BUY"
                    ?
                    1
                    :
                    -1;


                const qty=
                    Math.max(
                        0,
                        Number(item.qty)||0
                    );


                const multiplier=
                    (
                        Number(c.cvf)||1
                    )*
                    (
                        Number(c.scaling)||1
                    );


                const values=[];


                for(
                    let s=0;
                    s<16;
                    s++
                ){

                    const raw=
                        Number(
                            c.risk[s]||0
                        );


                    values.push(
                        raw*
                        qty*
                        direction*
                        multiplier
                    );

                }


                const margin=
                    Math.max(
                        ...values,
                        0
                    );


                return`

                    <tr>

                        <td>
                            ${index+1}
                        </td>

                        <td class="left">
                            <b>
                                ${escapeHtml(c.pfCode)}
                            </b>
                        </td>

                        <td>${c.type}</td>

                        <td>
                            ${formatExpiry(c.expiry)}
                        </td>

                        <td>
                            ${
                                c.type==="OPT"
                                ?
                                formatNumber(c.strike)
                                :
                                "-"
                            }
                        </td>

                        <td>
                            ${
                                c.type==="OPT"
                                ?
                                (
                                    c.optionType==="C"
                                    ?
                                    "CE"
                                    :
                                    "PE"
                                )
                                :
                                "-"
                            }
                        </td>

                        <td>
                            ${item.side}
                        </td>

                        <td>
                            ${formatNumber(qty)}
                        </td>

                        <td class="margin-value">
                            ₹${formatNumber(margin)}
                        </td>

                    </tr>

                `;

            }
        )
        .join("");


    const auditRows=
        (monthDeltas||[])
        .map(x=>`

            <tr>

                <td>
                    ${escapeHtml(x.code)}
                </td>

                <td>
                    ${formatExpiry(x.expiry)}
                </td>

                <td>
                    ${formatNumber(x.delta)}
                </td>

            </tr>

        `)
        .join("");


    const spreadRows=
        (spreadDetails||[])
        .map(x=>`

            <tr>

                <td>
                    ${escapeHtml(x.code||"")}
                </td>

                <td>${x.expiryA}</td>

                <td>${x.expiryB}</td>

                <td>
                    ${formatNumber(x.nearDelta)}
                </td>

                <td>
                    ${formatNumber(x.farDelta)}
                </td>

                <td>
                    ${formatNumber(x.spreadDelta)}
                </td>

                <td>
                    ${formatNumber(x.rate)}
                </td>

                <td>
                    ${formatNumber(x.amount)}
                </td>

            </tr>

        `)
        .join("");


    document
        .getElementById("summary")
        .innerHTML=`

            <div
                class="breakdown"
                style="display:block"
            >

                <div class="breakdown-title">
                    SPAN Audit — Delta Based Calendar Spread
                </div>

                <div class="breakdown-grid">

                    <div class="calc red">

                        <span>
                            Scanning Risk
                        </span>

                        <b>
                            ₹${formatNumber(
                                scanningRisk
                            )}
                        </b>

                    </div>


                    <div class="calc blue">

                        <span>
                            Calendar Spread Charge
                        </span>

                        <b>
                            ₹${formatNumber(
                                spreadCharge
                            )}
                        </b>

                    </div>


                    <div class="calc green">

                        <span>
                            Net Option Value Adjustment
                        </span>

                        <b>
                            ₹${formatNumber(
                                netOptionValue
                            )}
                        </b>

                    </div>

                </div>

            </div>

        `;


    document
        .getElementById("breakdown")
        .innerHTML="";

}


/* =========================================================
   SIDE / QTY
========================================================= */

function changeSide(
    index,
    value
){

    if(!portfolio[index])
        return;


    portfolio[index].side=
        value;


    const c=
        portfolio[index].contract;


    /*
      IMPORTANT:

      When changing to SELL:
          Option -> underlying SPN price

      When changing to BUY:
          Option -> option SPN premium

      FUT:
          always own SPN <p>
    */

    portfolio[index].price=
        getDefaultOutputPrice(
            c,
            value
        );


    renderPortfolio();

}


function changeQty(
    index,
    value
){

    if(!portfolio[index])
        return;


    let qty=
        Number(value);


    if(
        !Number.isFinite(qty)||
        qty<=0
    )
        qty=1;


    portfolio[index].qty=
        qty;


    renderPortfolio();

}

========================================================= */

function removeContract(index){

    portfolio.splice(

}


function clearPortfolio(){

/* =========================================================
   FORMAT
========================================================= */

function formatNumber(value){

    if(
        value===null||
        value===undefined||
        value===""
    )
        return"-";


    const n=
        Number(value);


    if(
        !Number.isFinite(n)
    )
        return String(value);


    return n.toLocaleString(
        "en-IN",
        {
            maximumFractionDigits:6
        }
    );

}


function parsedCountText(count){

    const n=
        Number(count)||0;


    return(
        n.toLocaleString(
            "en-IN"
        )+
        " records"
    );

}


function escapeHtml(value){

    return String(
        value??""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

   INITIAL RENDER
========================================================= */

renderPortfolio();
