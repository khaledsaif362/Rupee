<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bulk Orders</title>

<script src="/rs-login-gate.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:#f4f8f5;
  color:#216634;
  font-size:11px;
}

body{
  padding:6px;
}

.app{
  width:100%;
  max-width:1500px;
  margin:auto;
}

/* ================= NAV ================= */

.topbar{
  height:35px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:3px;
  background:#216634;
  border-radius:7px;
  overflow-x:auto;
  white-space:nowrap;
}

.nav{
  height:29px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 12px;
  color:white;
  text-decoration:none;
  font-size:9px;
  font-weight:900;
  border-radius:5px;
}

.nav:hover{
  background:#184d2b;
}

.nav.active{
  background:white;
  color:#216634;
}

.nav.title{
  font-size:10px;
  padding:0 13px;
}

/* ================= MAIN ================= */

.panel{
  margin-top:6px;
  padding:7px;
  background:white;
  border:1px solid #216634;
  border-radius:7px;
}

/* ================= EXCHANGES ================= */

.exchanges{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.ex{
  min-height:43px;
  padding:6px 7px;
  border:1px solid #bcd4c2;
  border-radius:6px;
  background:#f8fbf8;
}

.ex.selected{
  background:#edf6ef;
  border-color:#216634;
}

.ex-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
}

.ex label{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:9px;
  font-weight:900;
  cursor:pointer;
}

.ex input{
  width:12px;
  height:12px;
  margin:0;
  accent-color:#216634;
}

.ex-count{
  font-size:8px;
  font-weight:900;
  background:#216634;
  color:white;
  padding:2px 5px;
  border-radius:4px;
}

.cache{
  margin-top:3px;
  font-size:7px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cache.ok{
  color:#216634;
}

.cache.bad{
  color:#c0392b;
}

/* ================= CONTROL GRID ================= */

.controls{
  display:grid;
  grid-template-columns:1.15fr .65fr .95fr 1.25fr 1.25fr;
  gap:6px;
  margin-top:6px;
}

.box{
  border:1px solid #bcd4c2;
  border-radius:6px;
  padding:6px;
  background:#f8fbf8;
}

.lbl{
  font-size:7px;
  font-weight:900;
  margin-bottom:4px;
  color:#216634;
}

input[type=text],
input[type=number],
select{
  width:100%;
  height:27px;
  padding:3px 6px;
  border:1px solid #216634;
  border-radius:5px;
  outline:none;
  background:white;
  color:#216634;
  font-size:9px;
  font-weight:800;
}

input[type=file]{
  width:100%;
  font-size:8px;
  font-weight:700;
}

.client-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}

/* ================= CHECKS ================= */

.checks{
  min-height:27px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  padding:4px 5px;
  background:white;
  border:1px solid #216634;
  border-radius:5px;
}

.checks label{
  display:flex;
  align-items:center;
  gap:3px;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
}

.checks input{
  width:11px;
  height:11px;
  margin:0;
  accent-color:#216634;
}

/* ================= UPLOAD ================= */

.upload-box{
  margin-top:6px;
  display:flex;
  align-items:center;
  gap:6px;
}

.upload-box input{
  flex:1;
}

.upload-info{
  font-size:8px;
  font-weight:800;
  color:#64816c;
  white-space:nowrap;
}

/* ================= BUTTONS ================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  margin-top:6px;
}

button{
  height:29px;
  border:0;
  border-radius:5px;
  font-size:9px;
  font-weight:900;
  cursor:pointer;
}

.generate,
.download{
  background:#216634;
  color:white;
}

.clear{
  background:#c0392b;
  color:white;
}

button:disabled{
  opacity:.5;
}

/* ================= MESSAGE ================= */

.message{
  margin-top:5px;
  min-height:22px;
  padding:5px 7px;
  border:1px solid #bcd4c2;
  border-radius:5px;
  background:#fff;
  font-size:8px;
  font-weight:800;
}

.message.ok{
  color:#216634;
  background:#edf6ef;
}

.message.err{
  color:#c0392b;
  background:#fdeeee;
  border-color:#c0392b;
}

/* ================= OUTPUT ================= */

.output{
  margin-top:6px;
  border:1px solid #216634;
  border-radius:7px;
  background:white;
  overflow:auto;
  max-height:65vh;
  display:none;
}

.output.show{
  display:block;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:8px;
}

th,
td{
  border:1px solid #c8ddcc;
  padding:4px 6px;
  white-space:nowrap;
}

th{
  position:sticky;
  top:0;
  z-index:5;
  background:#216634;
  color:white;
  font-weight:900;
}

tr:nth-child(even){
  background:#f6faf7;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .controls{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  body{
    padding:4px;
  }

  .topbar{
    height:32px;
  }

  .nav{
    height:26px;
    padding:0 9px;
    font-size:8px;
  }

  .nav.title{
    font-size:9px;
  }

  .panel{
    padding:5px;
    margin-top:4px;
  }

  .exchanges{
    grid-template-columns:repeat(2,1fr);
    gap:4px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
    gap:4px;
  }

  .box{
    padding:5px;
  }

  .upload-box{
    display:block;
  }

  .upload-info{
    margin-top:3px;
  }

  .actions{
    grid-column:1 / -1;
  }

}

@media(max-width:400px){

  .controls{
    grid-template-columns:1fr;
  }

  .client-row{
    grid-template-columns:1fr 1fr;
  }

  .ex{
    min-height:40px;
  }

}
</style>
</head>

<script>
"use strict";

/* ============================================================
   CONFIG
============================================================ */

const DB_NAME="RupeeBulkOrderCache";
const DB_VERSION=1;
const STORE="bhavcopies";

const HEAD=[
  "",
  "Exch",
  "EXCH_SEG",
  "SegmentCode",
  "Symbol",
  "ClientID",
  "Buy/Sell",
  "Token",
  "Product",
  "Qty",
  "Price",
  "OrdType",
  "Trigger Price",
  "DQty",
  "Val",
  "Pro/Cli",
  "Participant ID",
  "LTP"
];

const EXCHANGES={
  NSE_EQ:{type:"EQ"},
  BSE_EQ:{type:"EQ"},
  NSE_FO:{type:"FO"},
  BSE_FO:{type:"FO"}
};

let clients=[];
let cached={};
let rowsOut=[];


/* ============================================================
   HELPERS
============================================================ */

const $=id=>document.getElementById(id);

function clean(v){
  return String(v??"")
    .replace(/^\uFEFF/,"")
    .trim();
}

function num(v){

  const n=Number(
    clean(v).replace(/,/g,"")
  );

  return Number.isFinite(n)
    ? n
    : null;
}

function message(text,type=""){

  const el=$("message");

  el.textContent=text;
  el.className="message "+type;

}

function shuffle(arr){

  const a=[...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];

  }

  return a;

}


/* ============================================================
   INDEXED DB
============================================================ */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const req=
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      req.onupgradeneeded=e=>{

        const db=e.target.result;

        if(
          !db.objectStoreNames.contains(
            STORE
          )
        ){

          db.createObjectStore(
            STORE,
            {keyPath:"key"}
          );

        }

      };

      req.onsuccess=
        ()=>resolve(req.result);

      req.onerror=
        ()=>reject(req.error);

    }
  );

}


async function saveCache(
  key,
  file
){

  const text=
    await file.text();

  const db=
    await openDB();

  await new Promise(
    (resolve,reject)=>{

      const tx=
        db.transaction(
          STORE,
          "readwrite"
        );

      tx.objectStore(
        STORE
      ).put({

        key:key,
        fileName:file.name,
        text:text,
        savedAt:Date.now()

      });

      tx.oncomplete=
        resolve;

      tx.onerror=
        ()=>reject(tx.error);

    }
  );

  db.close();

  return text;

}


async function getCache(key){

  const db=
    await openDB();

  const result=
    await new Promise(
      (resolve,reject)=>{

        const tx=
          db.transaction(
            STORE,
            "readonly"
          );

        const req=
          tx.objectStore(
            STORE
          ).get(key);

        req.onsuccess=
          ()=>resolve(
            req.result||null
          );

        req.onerror=
          ()=>reject(req.error);

      }
    );

  db.close();

  return result;

}


/* ============================================================
   CSV
============================================================ */

function delimiter(text){

  const first=
    text
      .replace(/^\uFEFF/,"")
      .split(/\r?\n/)
      .find(x=>x.trim())||"";

  const tests=[
    ",",
    ";",
    "\t",
    "|"
  ];

  let best=",";
  let score=-1;

  for(
    const d of tests
  ){

    const s=
      first.split(d).length;

    if(s>score){

      score=s;
      best=d;

    }

  }

  return best;

}


function csvParse(text){

  text=
    String(text||"")
      .replace(/^\uFEFF/,"")
      .replace(/\0/g,"");

  if(!text.trim())
    return [];

  const d=
    delimiter(text);

  const rows=[];
  let row=[];
  let cell="";
  let quote=false;

  for(
    let i=0;
    i<text.length;
    i++
  ){

    const c=text[i];

    if(quote){

      if(c==='"'){

        if(text[i+1]==='"'){

          cell+='"';
          i++;

        }else{

          quote=false;

        }

      }else{

        cell+=c;

      }

      continue;
    }

    if(c==='"'){

      quote=true;

    }else if(c===d){

      row.push(cell);
      cell="";

    }else if(c==="\n"){

      row.push(cell);

      if(
        row.some(x=>clean(x))
      )
        rows.push(row);

      row=[];
      cell="";

    }else if(c!=="\r"){

      cell+=c;

    }

  }

  if(
    cell!=="" ||
    row.length
  ){

    row.push(cell);

    if(
      row.some(x=>clean(x))
    )
      rows.push(row);

  }

  if(!rows.length)
    return [];

  const headers=
    rows[0].map(clean);

  return rows
    .slice(1)
    .map(r=>{

      const o={};

      headers.forEach(
        (h,i)=>{

          if(h)
            o[h]=r[i]??"";

        }
      );

      return o;

    });

}


/* ============================================================
   CLIENTS
============================================================ */

$("clientFile").addEventListener(
  "change",
  async()=>{

    const file=
      $("clientFile").files[0];

    if(!file)
      return;

    const text=
      await file.text();

    clients=[
      ...new Set(
        text
          .replace(/\r/g,"")
          .split(/[\n,\t;,]+/)
          .map(clean)
          .filter(Boolean)
          .filter(
            x=>
              ![
                "CLIENT",
                "CLIENTID",
                "CLIENT ID",
                "CLIENTCODE",
                "CLIENT CODE"
              ].includes(
                x.toUpperCase()
              )
          )
      )
    ];

    message(
      clients.length+
      " clients loaded.",
      "ok"
    );

  }
);


function getClients(){

  const a=[

    clean(
      $("client1").value
    ),

    clean(
      $("client2").value
    ),

    ...clients

  ].filter(Boolean);

  return [
    ...new Set(a)
  ];

}


/* ============================================================
   EXCHANGES
============================================================ */

function selectedExchanges(){

  return [
    ...document.querySelectorAll(
      ".exchange-check:checked"
    )
  ].map(x=>x.value);

}


function allocation(){

  const selected=
    selectedExchanges();

  const total=
    parseInt(
      $("recordCount").value,
      10
    )||0;

  const result={};

  selected.forEach(
    x=>result[x]=0
  );

  if(!selected.length)
    return result;

  const base=
    Math.floor(
      total/selected.length
    );

  const rem=
    total%selected.length;

  selected.forEach(
    (x,i)=>{

      result[x]=
        base+
        (
          i<rem
            ? 1
            : 0
        );

    }
  );

  return result;

}


function updateCounts(){

  const a=
    allocation();

  Object.keys(EXCHANGES)
    .forEach(
      key=>{

        const n=
          a[key]||0;

        $("count_"+key)
          .textContent=n;

      }
    );

  document.querySelectorAll(
    ".exchange-check"
  ).forEach(
    cb=>{

      cb.closest(".ex")
        .classList.toggle(
          "selected",
          cb.checked
        );

    }
  );

}


/* ============================================================
   CACHE STATUS
============================================================ */

async function refreshCache(){

  for(
    const key of Object.keys(EXCHANGES)
  ){

    const data=
      await getCache(key);

    cached[key]=data;

    const el=
      $("cache_"+key);

    if(data){

      el.textContent=
        "✓ "+data.fileName;

      el.className=
        "cache ok";

    }else{

      el.textContent=
        "Not cached";

      el.className=
        "cache bad";

    }

  }

}


/* ============================================================
   DETECT BHAVCOPY TYPE
============================================================ */

function detectType(
  file,
  text
){

  const name=
    file.name.toUpperCase();

  const sample=
    text
      .slice(0,5000)
      .toUpperCase();


  /*
    Filename detection first.
  */

  if(
    name.includes("NSE") &&
    (
      name.includes("FO") ||
      name.includes("F&O") ||
      name.includes("FNO")
    )
  )
    return "NSE_FO";


  if(
    name.includes("BSE") &&
    (
      name.includes("FO") ||
      name.includes("F&O") ||
      name.includes("FNO")
    )
  )
    return "BSE_FO";


  if(
    name.includes("NSE") &&
    (
      name.includes("EQ") ||
      name.includes("EQUITY")
    )
  )
    return "NSE_EQ";


  if(
    name.includes("BSE") &&
    (
      name.includes("EQ") ||
      name.includes("EQUITY")
    )
  )
    return "BSE_EQ";


  /*
    Header detection.
  */

  const hasFO=
    sample.includes("FININSTRMTP") &&
    sample.includes("XPRYDT");


  const hasEQ=
    sample.includes("SCTYSRS") &&
    sample.includes("OPNPRIC");


  if(hasFO){

    if(
      name.includes("BSE")
    )
      return "BSE_FO";

    return "NSE_FO";

  }


  if(hasEQ){

    if(
      name.includes("BSE")
    )
      return "BSE_EQ";

    return "NSE_EQ";

  }


  return null;

}


/* ============================================================
   PARSERS
============================================================ */

function isFuture(r){

  const t=
    clean(r.FinInstrmTp)
      .toUpperCase();

  const o=
    clean(r.OptnTp)
      .toUpperCase();

  return(
    t==="STF"||
    t==="IDF"||
    t==="FUT"||
    o==="FUT"
  );

}


function isOption(r){

  const t=
    clean(r.FinInstrmTp)
      .toUpperCase();

  const o=
    clean(r.OptnTp)
      .toUpperCase();

  return(
    t==="STO"||
    t==="IDO"||
    t==="OPT"||
    o==="CE"||
    o==="PE"
  );

}


/* ================= NSE EQ ================= */

function parseNSEEQ(data){

  const out=[];

  for(const r of data){

    if(
      clean(r.SctySrs)
        .toUpperCase()!=="EQ"
    )
      continue;

    const price=
      num(r.OpnPric);

    if(
      price===null||
      price<300||
      price>4000
    )
      continue;

    const token=
      clean(r.FinInstrmId);

    const symbol=
      clean(r.TckrSymb);

    if(
      !token||
      !symbol
    )
      continue;

    out.push({

      symbol:symbol+"-EQ",
      rawSymbol:symbol,
      token:token,
      ltp:price

    });

  }

  return out;

}


/* ================= BSE EQ ================= */

function parseBSEEQ(data){

  const out=[];

  for(const r of data){

    if(
      clean(r.SctySrs)
        .toUpperCase()!=="A"
    )
      continue;

    const price=
      num(r.OpnPric);

    if(
      price===null||
      price<300||
      price>4000
    )
      continue;

    const token=
      clean(r.FinInstrmId);

    const symbol=
      clean(r.TckrSymb);

    if(
      !token||
      !symbol
    )
      continue;

    out.push({

      symbol:symbol,
      rawSymbol:symbol,
      token:token,
      ltp:price

    });

  }

  return out;

}


/* ================= FO ================= */

function parseFO(
  data,
  bse=false
){

  const out=[];

  for(const r of data){

    if(
      !isFuture(r)&&
      !isOption(r)
    )
      continue;

    const raw=
      clean(r.TckrSymb)
        .toUpperCase();


    if(
      bse &&
      raw!=="SENSEX" &&
      raw!=="BANKEX"
    )
      continue;


    const token=
      clean(r.FinInstrmId);

    const name=
      clean(r.FinInstrmNm);

    const lot=
      num(r.NewBrdLotQty);

    const ltp=
      num(r.ClsPric);

    if(
      !token||
      !name||
      lot===null||
      ltp===null
    )
      continue;

    out.push({

      symbol:name,
      rawSymbol:raw,
      token:token,
      expiry:clean(r.XpryDt),
      strike:num(r.StrkPric),
      optn:
        isFuture(r)
          ?"FUT"
          :clean(r.OptnTp)
             .toUpperCase(),
      lot:lot,
      ltp:ltp,
      future:isFuture(r),
      option:isOption(r)

    });

  }

  return out;

}


/* ============================================================
   UPLOAD ALL BHAVCOPIES TOGETHER
============================================================ */

$("bhavUpload").addEventListener(
  "change",
  async()=>{

    const files=[
      ...$("bhavUpload").files
    ];

    if(!files.length)
      return;

    let success=[];
    let failed=[];

    message(
      "Processing "+files.length+" Bhavcopy file(s)..."
    );


    for(
      const file of files
    ){

      try{

        const text=
          await file.text();

        const key=
          detectType(
            file,
            text
          );

        if(!key){

          failed.push(
            file.name+
            " — type not detected"
          );

          continue;

        }


        const data=
          csvParse(text);


        let contracts=[];


        if(key==="NSE_EQ")
          contracts=
            parseNSEEQ(data);

        if(key==="BSE_EQ")
          contracts=
            parseBSEEQ(data);

        if(key==="NSE_FO")
          contracts=
            parseFO(data,false);

        if(key==="BSE_FO")
          contracts=
            parseFO(data,true);


        if(!contracts.length){

          failed.push(
            file.name+
            " — no valid records"
          );

          continue;

        }


        await saveCache(
          key,
          file
        );


        cached[key]={

          key:key,
          fileName:file.name,
          text:text,
          data:data,
          contracts:contracts,
          savedAt:Date.now()

        };


        success.push(
          key+
          ": "+
          contracts.length.toLocaleString()
        );


      }catch(e){

        failed.push(
          file.name+
          " — "+
          e.message
        );

      }

    }


    await refreshCache();

    $("bhavUpload").value="";


    if(failed.length){

      message(
        "✓ "+success.join(" • ")+
        " | ✗ "+failed.join(" • "),
        success.length
          ?"ok"
          :"err"
      );

    }else{

      message(
        "✓ "+success.join(" • "),
        "ok"
      );

    }

  }
);


/* ============================================================
   PRODUCT / ORDER TYPE
============================================================ */

function products(){

  return [
    ...document.querySelectorAll(
      ".box:nth-child(3) input:checked"
    )
  ].map(x=>x.value);

}


function orderTypes(){

  return [
    ...document.querySelectorAll(
      ".box:nth-child(4) input:checked"
    )
  ].map(x=>x.value);

}


/* ============================================================
   EQUITY PRODUCTS
============================================================ */

function eqProducts(
  selected,
  count
){

  if(!selected.length)
    throw Error(
      "Select a product."
    );

  const result=[];


  /*
    Ensure every selected EQ product
    appears when enough rows exist.
  */

  for(
    let i=0;
    i<Math.min(
      count,
      selected.length
    );
    i++
  ){

    result.push(
      selected[i]
    );

  }


  while(
    result.length<count
  ){

    result.push(
      selected[
        Math.floor(
          Math.random()*
          selected.length
        )
      ]
    );

  }

  return shuffle(result);

}


/* ============================================================
   CONTRACT SELECTION
============================================================ */

function eqContracts(
  contracts,
  count
){

  if(!contracts.length)
    throw Error(
      "No valid equity contracts."
    );

  const a=
    shuffle(contracts);

  const out=[];

  for(
    let i=0;
    i<count;
    i++
  ){

    out.push(
      a[
        i%a.length
      ]
    );

  }

  return out;

}


function foContracts(
  contracts,
  count,
  future
){

  const pool=
    contracts.filter(
      x=>
        future
          ?x.future
          :x.option
    );

  if(!pool.length)
    throw Error(
      "FO contract data unavailable."
    );

  const a=
    shuffle(pool);

  const out=[];

  for(
    let i=0;
    i<count;
    i++
  ){

    out.push(
      a[
        i%a.length
      ]
    );

  }

  return out;

}


/* ============================================================
   ORDER CREATION
============================================================ */

function createOrder(
  exchange,
  contract,
  client,
  product,
  orderType,
  side
){

  const eq=
    EXCHANGES[exchange].type==="EQ";

  const ltp=
    Number(contract.ltp||0);

  let price="";
  let trigger="";

  if(
    orderType==="Limit"
  )
    price=ltp.toFixed(2);


  if(
    orderType==="SL"
  ){

    price=
      ltp.toFixed(2);

    trigger=
      (
        side==="BUY"
          ?ltp-2
          :ltp+2
      ).toFixed(2);

  }


  if(
    orderType==="SL-M"
  ){

    trigger=
      (
        side==="BUY"
          ?ltp-2
          :ltp+2
      ).toFixed(2);

  }


  const qty=
    eq
      ?Math.floor(
        Math.random()*20
      )+1
      :contract.lot;


  let exch=
    "NSE";

  if(
    exchange.startsWith("BSE")
  )
    exch="BSE";


  let seg=
    "E";

  if(!eq)
    seg="D";


  let exchSeg;

  if(exchange==="NSE_EQ")
    exchSeg="NSEE";

  if(exchange==="BSE_EQ")
    exchSeg="BSEE";

  if(exchange==="NSE_FO")
    exchSeg="NSED";

  if(exchange==="BSE_FO")
    exchSeg="BSED";


  return {

    "":"",
    "Exch":exch,
    "EXCH_SEG":exchSeg,
    "SegmentCode":seg,
    "Symbol":contract.symbol,
    "ClientID":client,
    "Buy/Sell":side,
    "Token":contract.token,
    "Product":product,
    "Qty":qty,
    "Price":price,
    "OrdType":orderType,
    "Trigger Price":trigger,
    "DQty":"0",
    "Val":"DAY",
    "Pro/Cli":"C",
    "Participant ID":"",
    "LTP":ltp.toFixed(2)

  };

}


/* ============================================================
   GENERATE EQ
============================================================ */

function generateEQ(
  exchange,
  count
){

  const c=
    cached[exchange];

  if(!c)
    throw Error(
      exchange+
      " Bhavcopy not cached."
    );


  const ps=
    products();

  const ots=
    orderTypes();

  const cs=
    getClients();


  if(!ps.length)
    throw Error(
      "Select a product."
    );

  if(!ots.length)
    throw Error(
      "Select an order type."
    );

  if(!cs.length)
    throw Error(
      "Enter clients or upload client file."
    );


  const contracts=
    eqContracts(
      c.contracts,
      count
    );


  const prod=
    eqProducts(
      ps,
      count
    );


  const out=[];


  for(
    let i=0;
    i<count;
    i++
  ){

    const side=
      $("side").value==="BUY"
        ?"BUY"
        :$("side").value==="SELL"
          ?"SELL"
          :Math.random()<.5
            ?"BUY"
            :"SELL";


    out.push(
      createOrder(

        exchange,

        contracts[i],

        cs[
          Math.floor(
            Math.random()*cs.length
          )
        ],

        prod[i],

        ots[
          Math.floor(
            Math.random()*ots.length
          )
        ],

        side

      )
    );

  }


  return out;

}


/* ============================================================
   GENERATE FO
============================================================ */

function generateFO(
  exchange,
  count
){

  const c=
    cached[exchange];

  if(!c)
    throw Error(
      exchange+
      " Bhavcopy not cached."
    );


  const fut=
    c.contracts.filter(
      x=>x.future
    );

  const opt=
    c.contracts.filter(
      x=>x.option
    );


  if(
    !fut.length||
    !opt.length
  ){

    throw Error(
      exchange+
      " requires Futures and Options."
    );

  }


  const fc=
    Math.round(
      count*.80
    );

  const oc=
    count-fc;


  const contracts=[

    ...foContracts(
      fut,
      fc,
      true
    ),

    ...foContracts(
      opt,
      oc,
      false
    )

  ];


  const ps=
    products().filter(
      x=>
        x==="MARGIN"||
        x==="INTRADAY"
    );


  const ots=
    orderTypes();

  const cs=
    getClients();


  if(!ps.length)
    throw Error(
      "FO requires MARGIN or INTRADAY."
    );

  if(!ots.length)
    throw Error(
      "Select an order type."
    );

  if(!cs.length)
    throw Error(
      "Enter clients or upload client file."
    );


  return shuffle(
    contracts.map(
      c=>{

        const side=
          $("side").value==="BUY"
            ?"BUY"
            :$("side").value==="SELL"
              ?"SELL"
              :Math.random()<.5
                ?"BUY"
                :"SELL";


        return createOrder(

          exchange,

          c,

          cs[
            Math.floor(
              Math.random()*cs.length
            )
          ],

          ps[
            Math.floor(
              Math.random()*ps.length
            )
          ],

          ots[
            Math.floor(
              Math.random()*ots.length
            )
          ],

          side

        );

      }
    )
  );

}


/* ============================================================
   GENERATE
============================================================ */

$("generate").addEventListener(
  "click",
  async()=>{

    try{

      rowsOut=[];

      $("output")
        .classList.remove("show");


      const selected=
        selectedExchanges();


      if(!selected.length)
        throw Error(
          "Select at least one exchange."
        );


      const total=
        parseInt(
          $("recordCount").value,
          10
        );


      if(
        !Number.isInteger(total)||
        total<1
      )
        throw Error(
          "Enter valid records."
        );


      const cs=
        getClients();

      if(!cs.length)
        throw Error(
          "Enter Client 1/2 or upload client CSV."
        );


      /*
        Reload cache from IndexedDB.
      */

      for(
        const key of selected
      ){

        const c=
          await getCache(key);

        if(!c)
          throw Error(
            key+
            " Bhavcopy not cached."
          );


        const data=
          csvParse(c.text);


        let contracts=[];


        if(key==="NSE_EQ")
          contracts=
            parseNSEEQ(data);

        if(key==="BSE_EQ")
          contracts=
            parseBSEEQ(data);

        if(key==="NSE_FO")
          contracts=
            parseFO(data,false);

        if(key==="BSE_FO")
          contracts=
            parseFO(data,true);


        if(!contracts.length)
          throw Error(
            key+
            " has no valid contracts."
          );


        cached[key]={
          ...c,
          contracts:contracts
        };

      }


      const a=
        allocation();


      for(
        const key of selected
      ){

        if(
          EXCHANGES[key].type==="EQ"
        ){

          rowsOut.push(
            ...generateEQ(
              key,
              a[key]
            )
          );

        }else{

          rowsOut.push(
            ...generateFO(
              key,
              a[key]
            )
          );

        }

      }


      if(
        rowsOut.length!==total
      ){

        throw Error(
          "Generated "+
          rowsOut.length+
          " instead of "+
          total
        );

      }


      rowsOut=
        shuffle(rowsOut);


      render();


      message(
        "✓ "+total.toLocaleString()+
        " orders generated • "+
        selected.map(
          x=>
            x+
            " "+
            a[x]
        ).join(" • "),
        "ok"
      );


    }catch(e){

      rowsOut=[];

      $("output")
        .classList.remove("show");

      message(
        "✗ "+e.message,
        "err"
      );

    }

  }
);


/* ============================================================
   RENDER
============================================================ */

function esc(v){

  return String(v??"")
    .replace(
      /[&<>"']/g,
      x=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[x])
    );

}


function render(){

  const output=
    $("output");


  let html=
    "<table><thead><tr>";


  HEAD.forEach(
    h=>{
      html+=
        "<th>"+
        esc(h)+
        "</th>";
    }
  );


  html+=
    "</tr></thead><tbody>";


  rowsOut.forEach(
    row=>{

      html+="<tr>";

      HEAD.forEach(
        h=>{

          html+=
            "<td>"+
            esc(
              row[h]??""
            )+
            "</td>";

        }
      );

      html+="</tr>";

    }
  );


  html+=
    "</tbody></table>";


  output.innerHTML=html;

  output.classList.add("show");

}


/* ============================================================
   DOWNLOAD
============================================================ */

function csvEscape(v){

  const s=
    String(v??"");

  return /[",\r\n]/.test(s)
    ?'"'+
      s.replace(
        /"/g,
        '""'
      )+
      '"'
    :s;

}


$("download").addEventListener(
  "click",
  ()=>{

    if(!rowsOut.length){

      message(
        "Generate orders first.",
        "err"
      );

      return;

    }


    const lines=[

      HEAD.map(
        csvEscape
      ).join(",")

    ];


    rowsOut.forEach(
      row=>{

        lines.push(

          HEAD.map(
            h=>
              csvEscape(
                row[h]??""
              )
          ).join(",")

        );

      }
    );


    const blob=
      new Blob(
        [
          "\uFEFF"+
          lines.join("\r\n")
        ],
        {
          type:
            "text/csv;charset=utf-8"
        }
      );


    const url=
      URL.createObjectURL(blob);


    const a=
      document.createElement("a");

    a.href=url;

    a.download=
      "BULK_ORDERS_COMBINED_generated.csv";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);


    message(
      "✓ CSV downloaded.",
      "ok"
    );

  }
);


/* ============================================================
   CLEAR
============================================================ */

$("clear").addEventListener(
  "click",
  ()=>{

    rowsOut=[];

    $("output").innerHTML="";

    $("output")
      .classList.remove("show");

    message(
      "Ready.",
      "ok"
    );

  }
);


/* ============================================================
   EXCHANGE EVENTS
============================================================ */

document.querySelectorAll(
  ".exchange-check"
).forEach(
  cb=>{

    cb.addEventListener(
      "change",
      updateCounts
    );

  }
);


$("recordCount").addEventListener(
  "input",
  updateCounts
);


/* ============================================================
   INIT
============================================================ */

(async()=>{

  updateCounts();

  await refreshCache();

})();
