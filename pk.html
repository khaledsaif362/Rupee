<script>

/* =========================================================
   DATA
========================================================= */

let trades = [];

let varData = {};

let calculated = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function num(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    const x =
        Number(
            String(value)
                .replace(/,/g,"")
                .replace(/%/g,"")
                .trim()
        );


    return Number.isFinite(x)
        ? x
        : 0;

}


function money(value){

    return Number(value || 0)
        .toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function normalizeSymbol(value){

    return String(value || "")
        .replace(/\uFEFF/g,"")
        .trim()
        .toUpperCase();

}


function normalizeHeader(value){

    return String(value || "")
        .replace(/\uFEFF/g,"")
        .trim()
        .toUpperCase()
        .replace(/[._-]/g," ")
        .replace(/\s+/g," ");

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FIND CSV COLUMN
========================================================= */

function findColumn(row,names){

    const keys =
        Object.keys(row);


    /* Exact match */

    for(
        const name of names
    ){

        if(
            Object.prototype.hasOwnProperty.call(
                row,
                name
            )
        ){

            return row[name];

        }

    }


    /* Normalized match */

    for(
        const name of names
    ){

        const wanted =
            normalizeHeader(name);


        for(
            const key of keys
        ){

            if(
                normalizeHeader(key) ===
                wanted
            ){

                return row[key];

            }

        }

    }


    /* Fuzzy match */

    for(
        const name of names
    ){

        const wanted =
            normalizeHeader(name);


        for(
            const key of keys
        ){

            const actual =
                normalizeHeader(key);


            if(
                actual.includes(wanted) ||
                wanted.includes(actual)
            ){

                return row[key];

            }

        }

    }


    return "";

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    text =
        String(text || "")
        .replace(/^\uFEFF/,"");


    const rows = [];

    let row = [];

    let value = "";

    let quoted = false;


    for(
        let i=0;
        i<text.length;
        i++
    ){

        const c =
            text[i];

        const next =
            text[i+1];


        if(c === '"'){

            if(
                quoted &&
                next === '"'
            ){

                value += '"';

                i++;

            }
            else{

                quoted =
                    !quoted;

            }

            continue;

        }


        if(
            c === "," &&
            !quoted
        ){

            row.push(value);

            value = "";

            continue;

        }


        if(
            (c === "\n" || c === "\r") &&
            !quoted
        ){

            if(
                c === "\r" &&
                next === "\n"
            ){

                i++;

            }


            row.push(value);

            value = "";


            if(
                row.some(
                    x =>
                        String(x).trim() !== ""
                )
            ){

                rows.push(row);

            }


            row = [];

            continue;

        }


        value += c;

    }


    row.push(value);


    if(
        row.some(
            x =>
                String(x).trim() !== ""
        )
    ){

        rows.push(row);

    }


    return rows;

}


/* =========================================================
   CSV OBJECTS
========================================================= */

function csvToObjects(text){

    const rows =
        parseCSV(text);


    if(
        rows.length < 2
    ){

        return [];

    }


    const headers =
        rows[0].map(
            x =>
                String(x)
                    .replace(/^\uFEFF/,"")
                    .trim()
        );


    const output = [];


    for(
        let i=1;
        i<rows.length;
        i++
    ){

        const obj = {};


        headers.forEach(
            (header,index) => {

                obj[header] =
                    rows[i][index] ?? "";

            }
        );


        output.push(obj);

    }


    return output;

}


/* =========================================================
   LOAD TRADES
========================================================= */

function loadTrades(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const data =
                    csvToObjects(
                        e.target.result
                    );


                trades = [];


                data.forEach(
                    row => {

                        /*
                           Only the required fields
                           are extracted.

                           Other uploaded columns
                           are ignored.
                        */

                        const symbol =
                            normalizeSymbol(
                                findColumn(
                                    row,
                                    [
                                        "Symbol",
                                        "Scrip",
                                        "Security",
                                        "Scrip Name"
                                    ]
                                )
                            );


                        const qty =
                            num(
                                findColumn(
                                    row,
                                    [
                                        "Qty",
                                        "Quantity",
                                        "Trade Qty"
                                    ]
                                )
                            );


                        const price =
                            num(
                                findColumn(
                                    row,
                                    [
                                        "Price",
                                        "Trade Price",
                                        "Traded Price"
                                    ]
                                )
                            );


                        if(
                            !symbol ||
                            qty <= 0 ||
                            price <= 0
                        ){

                            return;

                        }


                        const sideText =
                            String(
                                findColumn(
                                    row,
                                    [
                                        "Buy/Sell",
                                        "Buy Sell",
                                        "BuySell",
                                        "Side"
                                    ]
                                )
                            )
                            .trim()
                            .toUpperCase();


                        const side =
                            (
                                sideText === "SELL" ||
                                sideText === "S"
                            )
                                ? "Sell"
                                : "Buy";


                        trades.push({

                            side:
                                side,

                            symbol:
                                symbol,

                            qty:
                                qty,

                            price:
                                price

                        });

                    }
                );


                document.getElementById(
                    "tradeStatus"
                ).textContent =
                    "Trades: " +
                    trades.length;


                document.getElementById(
                    "tradeStatus"
                ).className =
                    trades.length
                        ? "status ok"
                        : "status error";


                updateSymbolCount();

                recalculate();

            }
            catch(error){

                console.error(error);

                document.getElementById(
                    "tradeStatus"
                ).className =
                    "status error";

                document.getElementById(
                    "tradeStatus"
                ).textContent =
                    "Trade file error";

            }

        };


    reader.readAsText(file);

}


/* =========================================================
   LOAD VAR
========================================================= */

function loadVAR(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            varData = {};

            let count = 0;


            const lines =
                e.target.result
                    .replace(/^\uFEFF/,"")
                    .split(/\r?\n/);


            lines.forEach(
                line => {

                    if(
                        !line.trim()
                    ){

                        return;

                    }


                    const parts =
                        line.split(",");


                    /*
                       Example:

                       20,SBIN,EQ,INE062A01020,
                       9.48,0.00,9.48,3.50,0.00,12.98

                       Symbol = column 2
                       VAR    = column 10
                    */

                    if(
                        parts.length < 10
                    ){

                        return;

                    }


                    const symbol =
                        normalizeSymbol(
                            parts[1]
                        );


                    const rate =
                        num(
                            parts[9]
                        );


                    if(!symbol)
                        return;


                    varData[symbol] =
                        rate;

                    count++;

                }
            );


            const status =
                document.getElementById(
                    "varStatus"
                );


            if(count){

                status.className =
                    "status ok";

                status.textContent =
                    "VAR Loaded: " +
                    count +
                    " symbols";

            }
            else{

                status.className =
                    "status error";

                status.textContent =
                    "VAR: No records";

            }


            recalculate();

        };


    reader.readAsText(file);

}


/* =========================================================
   MARGIN RATE
========================================================= */

function getMarginRate(symbol){

    const useVAR =
        document.getElementById(
            "useVAR"
        ).checked;


    /*
       Fixed mode
       = exactly 20%
    */

    if(!useVAR){

        return 20;

    }


    /*
       VAR mode
       = MAX(20%, VAR)
    */

    if(
        !Object.prototype.hasOwnProperty.call(
            varData,
            symbol
        )
    ){

        return null;

    }


    return Math.max(
        20,
        varData[symbol]
    );

}


/* =========================================================
   CORE ENGINE
========================================================= */

function calculate(){

    let ledger =
        num(
            document.getElementById(
                "sod"
            ).value
        );


    /*
       Current margin blocked
       across ALL open positions.
    */

    let marginBlocked = 0;


    /*
       Highest margin blocked
       during the sequence.
    */

    let peakMargin = 0;


    /*
       Each symbol has its own
       position and lots.
    */

    const states = {};


    const rows = [];


    trades.forEach(
        trade => {

            const symbol =
                normalizeSymbol(
                    trade.symbol
                );


            if(
                !states[symbol]
            ){

                states[symbol] = {

                    net:0,

                    lots:[]

                };

            }


            const state =
                states[symbol];


            const signedQty =
                trade.side === "Buy"
                    ? trade.qty
                    : -trade.qty;


            const previousNet =
                state.net;


            const tradeValue =
                trade.qty *
                trade.price;


            const marginRate =
                getMarginRate(
                    symbol
                );


            /*
               Margin if the complete
               trade were fresh.
            */

            const completeTradeMargin =
                marginRate === null
                    ? 0
                    : tradeValue *
                      marginRate /
                      100;


            /* =================================================
               DETERMINE FRESH / SQUARE-OFF / REVERSAL
            ================================================= */

            let squareOffQty = 0;

            let freshQty = 0;


            const opposite =
                previousNet !== 0 &&
                Math.sign(previousNet) !==
                Math.sign(signedQty);


            if(opposite){

                /*
                   First close the old position.
                */

                squareOffQty =
                    Math.min(
                        Math.abs(previousNet),
                        Math.abs(signedQty)
                    );


                /*
                   Remaining quantity becomes
                   the new position.
                */

                freshQty =
                    trade.qty -
                    squareOffQty;

            }
            else{

                /*
                   Complete trade is fresh.
                */

                freshQty =
                    trade.qty;

            }


            /* =================================================
               RELEASE OLD MARGIN
            ================================================= */

            let marginReleased = 0;

            let remainingClose =
                squareOffQty;


            /*
               FIFO release.

               We release the actual margin
               which was charged against
               the old quantity.
            */

            while(
                remainingClose > 0 &&
                state.lots.length > 0
            ){

                const lot =
                    state.lots[0];


                const closeQty =
                    Math.min(
                        remainingClose,
                        lot.qty
                    );


                const marginPerQty =
                    lot.qty > 0
                        ? lot.margin /
                          lot.qty
                        : 0;


                const release =
                    closeQty *
                    marginPerQty;


                marginReleased +=
                    release;


                lot.qty -=
                    closeQty;


                lot.margin -=
                    release;


                remainingClose -=
                    closeQty;


                if(
                    lot.qty <=
                    0.00000001
                ){

                    state.lots.shift();

                }

            }


            /* =================================================
               CHARGE FRESH MARGIN
            ================================================= */

            let marginCharged = 0;


            if(
                freshQty > 0 &&
                marginRate !== null
            ){

                /*
                   Example:

                   BUY 100
                   SELL 150

                   100 = square-off
                    50 = fresh

                   Only 50 is charged.
                */

                marginCharged =
                    completeTradeMargin *
                    (
                        freshQty /
                        trade.qty
                    );


                state.lots.push({

                    qty:
                        freshQty,

                    margin:
                        marginCharged

                });

            }


            /* =================================================
               UPDATE MARGIN BLOCKED
            ================================================= */

            marginBlocked =
                marginBlocked -
                marginReleased +
                marginCharged;


            if(
                Math.abs(
                    marginBlocked
                ) < 0.000001
            ){

                marginBlocked = 0;

            }


            /* =================================================
               UPDATE PEAK
            ================================================= */

            if(
                marginBlocked >
                peakMargin
            ){

                peakMargin =
                    marginBlocked;

            }


            /* =================================================
               UPDATE LEDGER
            ================================================= */

            ledger =
                ledger -
                marginCharged +
                marginReleased;


            /* =================================================
               NET POSITION
            ================================================= */

            const netPosition =
                previousNet +
                signedQty;


            state.net =
                netPosition;


            /* =================================================
               TYPE
            ================================================= */

            let type =
                "FRESH";


            if(
                squareOffQty > 0 &&
                freshQty > 0
            ){

                type =
                    "REVERSAL";

            }
            else if(
                squareOffQty > 0
            ){

                type =
                    "SQUARE-OFF";

            }


            /* =================================================
               SAVE
            ================================================= */

            rows.push({

                side:
                    trade.side,

                symbol:
                    symbol,

                qty:
                    trade.qty,

                price:
                    trade.price,

                tradeValue:
                    tradeValue,

                type:
                    type,

                charged:
                    marginCharged,

                released:
                    marginReleased,

                blocked:
                    marginBlocked,

                net:
                    netPosition,

                peak:
                    peakMargin,

                ledger:
                    ledger

            });

        }
    );


    return {

        rows:
            rows,

        peak:
            peakMargin,

        ledger:
            ledger

    };

}


/* =========================================================
   RECALCULATE
========================================================= */

function recalculate(){

    calculated =
        calculate();


    document.getElementById(
        "peak"
    ).textContent =
        money(
            calculated.peak
        );


    document.getElementById(
        "ledger"
    ).textContent =
        money(
            calculated.ledger
        );


    render();

}


/* =========================================================
   FILTER VALUE
========================================================= */

function getFilter(name){

    const element =
        document.querySelector(
            `[data-filter="${name}"]`
        );


    if(!element)
        return "";


    return String(
        element.value || ""
    )
    .trim()
    .toUpperCase();

}


/* =========================================================
   FILTER MATCH
========================================================= */

function matches(row){

    const values = {

        side:
            row.side,

        symbol:
            row.symbol,

        qty:
            row.qty,

        price:
            row.price,

        tradeValue:
            row.tradeValue,

        type:
            row.type,

        charged:
            row.charged,

        released:
            row.released,

        blocked:
            row.blocked,

        peak:
            row.peak,

        net:
            row.net,

        ledger:
            row.ledger

    };


    for(
        const key in values
    ){

        const filter =
            getFilter(key);


        if(!filter)
            continue;


        const value =
            String(
                values[key] ?? ""
            )
            .toUpperCase();


        if(
            !value.includes(filter)
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function render(){

    const tbody =
        document.getElementById(
            "tbody"
        );


    tbody.innerHTML = "";


    if(
        !calculated ||
        !calculated.rows.length
    ){

        tbody.innerHTML = `

        <tr>

            <td colspan="12">

                <div class="empty">

                    Upload a trade file or add a trade manually

                </div>

            </td>

        </tr>

        `;


        document.getElementById(
            "displayed"
        ).textContent =
            "0";


        return;

    }


    /*
       Filters only affect display.
       Calculation is NOT changed.
    */

    const rows =
        calculated.rows.filter(
            matches
        );


    document.getElementById(
        "displayed"
    ).textContent =
        rows.length;


    if(!rows.length){

        tbody.innerHTML = `

        <tr>

            <td colspan="12">

                <div class="empty">

                    No rows match the filter

                </div>

            </td>

        </tr>

        `;

        return;

    }


    rows.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );


            /*
               Highlight rows where
               peak margin was reached.
            */

            if(
                Math.abs(
                    row.blocked -
                    calculated.peak
                ) < 0.000001 &&
                calculated.peak > 0
            ){

                tr.classList.add(
                    "peak-row"
                );

            }


            let typeClass =
                "fresh";


            if(
                row.type ===
                "SQUARE-OFF"
            ){

                typeClass =
                    "square";

            }


            if(
                row.type ===
                "REVERSAL"
            ){

                typeClass =
                    "reversal";

            }


            const ledgerClass =
                row.ledger < 0
                    ? "negative"
                    : "";


            tr.innerHTML = `

            <td class="left">

                <strong>
                    ${escapeHTML(row.side)}
                </strong>

            </td>


            <td class="left">

                <strong>
                    ${escapeHTML(row.symbol)}
                </strong>

            </td>


            <td>
                ${money(row.qty)}
            </td>


            <td>
                ${money(row.price)}
            </td>


            <td>
                ${money(row.tradeValue)}
            </td>


            <td class="${typeClass}">

                ${row.type}

            </td>


            <td class="charged">

                ${money(row.charged)}

            </td>


            <td class="released">

                ${money(row.released)}

            </td>


            <td class="blocked">

                ${money(row.blocked)}

            </td>


            <td>

                ${money(row.peak)}

            </td>


            <td>

                ${money(row.net)}

            </td>


            <td class="${ledgerClass}">

                ${money(row.ledger)}

            </td>

            `;


            tbody.appendChild(tr);

        }
    );

}


/* =========================================================
   ADD MANUAL TRADE
========================================================= */

function addTrade(){

    const symbol =
        normalizeSymbol(
            document.getElementById(
                "symbol"
            ).value
        );


    const qty =
        num(
            document.getElementById(
                "qty"
            ).value
        );


    const price =
        num(
            document.getElementById(
                "price"
            ).value
        );


    if(
        !symbol ||
        qty <= 0 ||
        price <= 0
    ){

        alert(
            "Enter Symbol, Qty and Price."
        );

        return;

    }


    trades.push({

        side:
            document.getElementById(
                "side"
            ).value,

        symbol:
            symbol,

        qty:
            qty,

        price:
            price

    });


    document.getElementById(
        "tradeStatus"
    ).textContent =
        "Trades: " +
        trades.length;


    document.getElementById(
        "tradeStatus"
    ).className =
        "status ok";


    updateSymbolCount();

    recalculate();


    /*
       Clear only trade-specific
       manual inputs.
    */

    document.getElementById(
        "qty"
    ).value = "";

    document.getElementById(
        "price"
    ).value = "";


    document.getElementById(
        "symbol"
    ).focus();

}


/* =========================================================
   SYMBOL COUNT
========================================================= */

function updateSymbolCount(){

    const set =
        new Set();


    trades.forEach(
        trade => {

            if(
                trade.symbol
            ){

                set.add(
                    normalizeSymbol(
                        trade.symbol
                    )
                );

            }

        }
    );


    document.getElementById(
        "symbols"
    ).textContent =
        set.size;

}


/* =========================================================
   CLEAR
========================================================= */

function clearAll(){

    trades = [];

    varData = {};

    calculated = null;


    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            element => {

                if(
                    element.tagName ===
                    "SELECT"
                ){

                    element.selectedIndex =
                        0;

                }
                else{

                    element.value =
                        "";

                }

            }
        );


    document.getElementById(
        "tbody"
    ).innerHTML = `

    <tr>

        <td colspan="12">

            <div class="empty">

                Upload a trade file or add a trade manually

            </div>

        </td>

    </tr>

    `;


    document.getElementById(
        "tradeStatus"
    ).textContent =
        "Trades: 0";


    document.getElementById(
        "tradeStatus"
    ).className =
        "status";


    document.getElementById(
        "varStatus"
    ).textContent =
        "VAR: Not Loaded";


    document.getElementById(
        "varStatus"
    ).className =
        "status warn";


    document.getElementById(
        "symbols"
    ).textContent =
        "0";


    document.getElementById(
        "displayed"
    ).textContent =
        "0";


    document.getElementById(
        "peak"
    ).textContent =
        "0.00";


    document.getElementById(
        "ledger"
    ).textContent =
        money(
            num(
                document.getElementById(
                    "sod"
                ).value
            )
        );


    document.getElementById(
        "tradeFile"
    ).value =
        "";


    document.getElementById(
        "varFile"
    ).value =
        "";

}


/* =========================================================
   INITIAL
========================================================= */

recalculate();

</script>
