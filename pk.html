<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let trades = [];

let calculatedRows = [];

let varData = {};

let varLoaded = false;


/* =========================================================
   NUMBER
========================================================= */

function number(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    const n =
        Number(
            String(value)
                .replace(/,/g,"")
                .replace(/%/g,"")
                .trim()
        );


    return Number.isFinite(n)
        ? n
        : 0;

}


/* =========================================================
   MONEY
========================================================= */

function money(value){

    return Number(value || 0)
        .toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:2,

                maximumFractionDigits:2
            }
        );

}


/* =========================================================
   CLEAN
========================================================= */

function clean(value){

    return String(value ?? "")
        .replace(/\uFEFF/g,"")
        .trim();

}


/* =========================================================
   SYMBOL
========================================================= */

function symbol(value){

    return clean(value)
        .toUpperCase();

}


/* =========================================================
   HEADER NORMALIZATION
========================================================= */

function header(value){

    return clean(value)
        .toUpperCase()
        .replace(/[._-]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];

    let value = "";

    let quoted = false;


    text =
        String(text || "")
        .replace(/^\uFEFF/,"");


    for(
        let i=0;
        i<text.length;
        i++
    ){

        const c =
            text[i];

        const next =
            text[i+1];


        if(c === '"'){

            if(
                quoted &&
                next === '"'
            ){

                value += '"';

                i++;

            }
            else{

                quoted =
                    !quoted;

            }

            continue;

        }


        if(
            c === "," &&
            !quoted
        ){

            row.push(value);

            value = "";

            continue;

        }


        if(
            (
                c === "\n" ||
                c === "\r"
            ) &&
            !quoted
        ){

            if(
                c === "\r" &&
                next === "\n"
            ){

                i++;

            }


            row.push(value);

            value = "";


            if(
                row.some(
                    x =>
                        clean(x) !== ""
                )
            ){

                rows.push(row);

            }


            row = [];

            continue;

        }


        value += c;

    }


    row.push(value);


    if(
        row.some(
            x =>
                clean(x) !== ""
        )
    ){

        rows.push(row);

    }


    return rows;

}


/* =========================================================
   CSV → OBJECTS
========================================================= */

function csvObjects(text){

    const rows =
        parseCSV(text);


    if(
        rows.length < 2
    ){

        return [];

    }


    const headers =
        rows[0].map(
            x =>
                clean(x)
        );


    const result = [];


    for(
        let i=1;
        i<rows.length;
        i++
    ){

        const obj = {};


        headers.forEach(
            (h,j) => {

                obj[h] =
                    rows[i][j] ?? "";

            }
        );


        result.push(obj);

    }


    return result;

}


/* =========================================================
   GET COLUMN
========================================================= */

function getColumn(row,names){

    const keys =
        Object.keys(row);


    /*
       Exact match
    */

    for(
        const name of names
    ){

        if(
            Object.prototype.hasOwnProperty.call(
                row,
                name
            )
        ){

            return row[name];

        }

    }


    /*
       Normalized match
    */

    for(
        const name of names
    ){

        const wanted =
            header(name);


        for(
            const key of keys
        ){

            if(
                header(key) ===
                wanted
            ){

                return row[key];

            }

        }

    }


    /*
       Ignore spaces
    */

    for(
        const name of names
    ){

        const wanted =
            header(name)
            .replace(/\s/g,"");


        for(
            const key of keys
        ){

            const actual =
                header(key)
                .replace(/\s/g,"");


            if(
                actual ===
                wanted
            ){

                return row[key];

            }

        }

    }


    return "";

}


/* =========================================================
   ORDER NUMBER
========================================================= */

function getOrderNumber(row){

    return clean(
        getColumn(
            row,
            [

                "Order No",

                "OrderNo",

                "Order Number",

                "OrderNumber",

                "ORDER_NO",

                "ORDERNO",

                "ORDER NUMBER",

                "ORDERNUMBER",

                "Order No.",

                "OrderNo.",

                "Ord No",

                "OrdNo",

                "ORD_NO",

                "ORDER ID",

                "Order ID",

                "OrderID"

            ]
        )
    );

}


/* =========================================================
   TRADE FILE UPLOAD
========================================================= */

function uploadTradeFile(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const data =
                    csvObjects(
                        e.target.result
                    );


                trades = [];


                data.forEach(
                    row => {

                        /*
                           Order number is displayed
                           but NOT required for
                           calculation.
                        */

                        const orderNo =
                            getOrderNumber(
                                row
                            );


                        const side =
                            clean(
                                getColumn(
                                    row,
                                    [

                                        "Buy/Sell",

                                        "Buy Sell",

                                        "Side",

                                        "B/S"

                                    ]
                                )
                            );


                        const s =
                            symbol(
                                getColumn(
                                    row,
                                    [

                                        "Symbol",

                                        "Scrip",

                                        "Security",

                                        "Scrip Name"

                                    ]
                                )
                            );


                        const qty =
                            number(
                                getColumn(
                                    row,
                                    [

                                        "Qty",

                                        "Quantity",

                                        "Traded Qty",

                                        "Traded Quantity"

                                    ]
                                )
                            );


                        const price =
                            number(
                                getColumn(
                                    row,
                                    [

                                        "Price",

                                        "Trade Price",

                                        "Traded Price",

                                        "TradedPrice"

                                    ]
                                )
                            );


                        let tradeValue =
                            number(
                                getColumn(
                                    row,
                                    [

                                        "Trade Value",

                                        "TradeValue",

                                        "Trade Value Amount"

                                    ]
                                )
                            );


                        /*
                           If Trade Value is not
                           present, calculate:

                           Qty × Price
                        */

                        if(
                            tradeValue === 0 &&
                            qty !== 0 &&
                            price !== 0
                        ){

                            tradeValue =
                                qty * price;

                        }


                        /*
                           Only these are required
                           for calculation.
                        */

                        if(
                            !s ||
                            qty === 0 ||
                            price === 0
                        ){

                            return;

                        }


                        trades.push({

                            orderNo:
                                orderNo,

                            side:
                                side.toUpperCase() ===
                                "SELL"
                                    ? "Sell"
                                    : "Buy",

                            symbol:
                                s,

                            qty:
                                qty,

                            price:
                                price,

                            tradeValue:
                                tradeValue

                        });

                    }
                );


                calculate();

                updateStatus();

                render();

            }
            catch(error){

                console.error(error);


                const status =
                    document.getElementById(
                        "status"
                    );


                status.textContent =
                    "Invalid trade file";


                status.className =
                    "status error";

            }

        };


    reader.readAsText(file);

}


/* =========================================================
   VAR FILE UPLOAD
========================================================= */

function uploadVAR(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                varData = {};

                varLoaded = false;


                const text =
                    String(
                        e.target.result || ""
                    )
                    .replace(
                        /^\uFEFF/,
                        ""
                    );


                const rows =
                    parseCSV(text);


                /*
                   VAR format:

                   20,
                   SBIN,
                   EQ,
                   INE062A01020,
                   9.48,
                   0.00,
                   9.48,
                   3.50,
                   0.00,
                   12.98

                   Column 2 = Symbol
                   Column 10 = Applicable VAR %
                */

                rows.forEach(
                    row => {

                        if(
                            row.length < 10
                        ){

                            return;

                        }


                        const s =
                            symbol(
                                row[1]
                            );


                        const rate =
                            number(
                                row[9]
                            );


                        if(
                            !s ||
                            !Number.isFinite(
                                rate
                            )
                        ){

                            return;

                        }


                        varData[s] =
                            rate;

                    }
                );


                varLoaded =
                    Object.keys(
                        varData
                    ).length > 0;


                const status =
                    document.getElementById(
                        "varStatus"
                    );


                if(varLoaded){

                    status.textContent =
                        "VAR Loaded: " +
                        Object.keys(
                            varData
                        ).length +
                        " symbols";


                    status.className =
                        "status ok";

                }
                else{

                    status.textContent =
                        "VAR: No records";


                    status.className =
                        "status error";

                }


                calculate();

                render();

            }
            catch(error){

                console.error(error);


                const status =
                    document.getElementById(
                        "varStatus"
                    );


                status.textContent =
                    "VAR: Invalid file";


                status.className =
                    "status error";

            }

        };


    reader.readAsText(file);

}


/* =========================================================
   VAR MODE
========================================================= */

function varModeChanged(){

    const checkbox =
        document.getElementById(
            "useVAR"
        );


    const useVAR =
        checkbox.checked;


    /*
       Don't allow VAR mode until
       VAR file is uploaded.
    */

    if(
        useVAR &&
        !varLoaded
    ){

        alert(
            "Please upload the VAR file first."
        );


        checkbox.checked =
            false;

    }


    calculate();

    render();

}


/* =========================================================
   GET MARGIN RATE
========================================================= */

function getMarginRate(symbolName){

    /*
       Default:
       20%
    */

    let rate = 20;


    const useVAR =
        document.getElementById(
            "useVAR"
        ).checked;


    /*
       Fixed 20% mode
    */

    if(!useVAR){

        return 20;

    }


    /*
       VAR mode
    */

    const varRate =
        varData[
            symbolName
        ];


    /*
       Symbol not found:

       minimum 20%
    */

    if(
        varRate === undefined ||
        !Number.isFinite(
            varRate
        )
    ){

        return 20;

    }


    /*
       Minimum 20%.

       12.98 → 20
       18.00 → 20
       20.00 → 20
       25.00 → 25
       30.00 → 30
    */

    rate =
        Math.max(
            20,
            varRate
        );


    return rate;

}


/* =========================================================
   EXCEL CALCULATION
========================================================= */

function calculate(){

    calculatedRows = [];


    /*
       Previous row for each symbol.
    */

    const lastRowBySymbol = {};


    /*
       Net position after each row.
    */

    const netAfterByRow = {};


    /*
       Position direction.
    */

    const directionByRow = {};


    for(
        let i=0;
        i<trades.length;
        i++
    ){

        const trade =
            trades[i];


        /*
           Excel row.
        */

        const excelRow =
            i + 2;


        /* =================================================
           H = TRADE VALUE
        ================================================= */

        const H =
            trade.tradeValue;


        /* =================================================
           M = SIGNED QTY
           Internal only.
        ================================================= */

        const M =
            trade.side === "Buy"
                ? trade.qty
                : -trade.qty;


        /* =================================================
           N = PREVIOUS SAME-SYMBOL ROW
           Internal only.
        ================================================= */

        const N =
            lastRowBySymbol[
                trade.symbol
            ] || 0;


        /* =================================================
           O = NET POSITION PRIOR
           Internal only.
        ================================================= */

        let O = 0;


        if(N !== 0){

            O =
                netAfterByRow[N] || 0;

        }


        /* =================================================
           P = NET POSITION AFTER
        ================================================= */

        const P =
            O + M;


        /* =================================================
           Q = POSITION DIRECTION PRIOR
           Internal only.
        ================================================= */

        let Q = 0;


        if(N !== 0){

            Q =
                directionByRow[N] || 0;

        }


        /* =================================================
           R = POSITION DIRECTION CURRENT
           Internal only.
        ================================================= */

        let R = 0;


        if(P === 0){

            R = 0;

        }
        else if(
            Q === 0 ||
            Math.sign(M) === Q
        ){

            R =
                Math.sign(M);

        }
        else{

            R =
                Q;

        }


        /* =================================================
           S = IS FRESH
        ================================================= */

        const S =
            (
                Q === 0 ||
                Math.sign(M) === Q
            );


        /* =================================================
           MARGIN RATE
        ================================================= */

        const marginRate =
            getMarginRate(
                trade.symbol
            );


        /* =================================================
           J = PEAK MARGIN

           Fixed mode:
           Trade Value × 20%

           VAR mode:
           Trade Value × VAR rate

           Minimum 20%.
        ================================================= */

        const J =
            H *
            marginRate /
            100;


        /* =================================================
           T = RUNNING TOTAL
        ================================================= */

        let previousRunning =
            0;


        if(i > 0){

            previousRunning =
                calculatedRows[
                    i - 1
                ].runningTotal;

        }


        const T =
            previousRunning +
            (
                S
                    ? J
                    : 0
            );


        /* =================================================
           K = REVISED PEAK MARGIN
        ================================================= */

        const K =
            S
                ? T
                : null;


        /* =================================================
           SAVE
        ================================================= */

        calculatedRows.push({

            excelRow:
                excelRow,

            orderNo:
                trade.orderNo,

            side:
                trade.side,

            symbol:
                trade.symbol,

            qty:
                trade.qty,

            price:
                trade.price,

            tradeValue:
                H,

            peakMargin:
                J,

            revisedPeakMargin:
                K,

            netQty:
                P,

            isFresh:
                S,

            runningTotal:
                T

        });


        /*
           Store hidden calculation
           information.
        */

        lastRowBySymbol[
            trade.symbol
        ] =
            excelRow;


        netAfterByRow[
            excelRow
        ] =
            P;


        directionByRow[
            excelRow
        ] =
            R;

    }

}


/* =========================================================
   FILTER VALUE
========================================================= */

function getFilter(name){

    const element =
        document.querySelector(
            `[data-filter="${name}"]`
        );


    if(!element){

        return "";

    }


    return String(
        element.value || ""
    )
    .trim()
    .toUpperCase();

}


/* =========================================================
   NUMERIC FILTER
========================================================= */

function numericMatches(
    value,
    filter
){

    if(!filter){

        return true;

    }


    const raw =
        String(
            value ?? ""
        )
        .replace(/,/g,"")
        .trim()
        .toUpperCase();


    const formatted =
        money(value)
        .replace(/,/g,"")
        .toUpperCase();


    const typed =
        filter
        .replace(/,/g,"")
        .trim()
        .toUpperCase();


    return (
        raw.includes(typed) ||
        formatted.includes(typed)
    );

}


/* =========================================================
   FILTER MATCH
========================================================= */

function rowMatches(row){

    /* ORDER NO */

    const orderFilter =
        getFilter(
            "orderNo"
        );


    if(
        orderFilter &&
        !String(
            row.orderNo
        )
        .toUpperCase()
        .includes(
            orderFilter
        )
    ){

        return false;

    }


    /* BUY / SELL */

    const sideFilter =
        getFilter(
            "side"
        );


    if(
        sideFilter &&
        row.side
            .toUpperCase() !==
        sideFilter
    ){

        return false;

    }


    /* SYMBOL */

    const symbolFilter =
        getFilter(
            "symbol"
        );


    if(
        symbolFilter &&
        !row.symbol
            .toUpperCase()
            .includes(
                symbolFilter
            )
    ){

        return false;

    }


    /* TRADED QTY */

    if(
        !numericMatches(
            row.qty,
            getFilter(
                "qty"
            )
        )
    ){

        return false;

    }


    /* TRADED PRICE */

    if(
        !numericMatches(
            row.price,
            getFilter(
                "price"
            )
        )
    ){

        return false;

    }


    /* TRADE VALUE */

    if(
        !numericMatches(
            row.tradeValue,
            getFilter(
                "tradeValue"
            )
        )
    ){

        return false;

    }


    /* PEAK MARGIN */

    if(
        !numericMatches(
            row.peakMargin,
            getFilter(
                "peakMargin"
            )
        )
    ){

        return false;

    }


    /* REVISED PEAK MARGIN */

    if(
        !numericMatches(
            row.revisedPeakMargin,
            getFilter(
                "revisedPeak"
            )
        )
    ){

        return false;

    }


    /* NET QTY */

    if(
        !numericMatches(
            row.netQty,
            getFilter(
                "netQty"
            )
        )
    ){

        return false;

    }


    /* IS FRESH */

    const freshFilter =
        getFilter(
            "fresh"
        );


    if(
        freshFilter &&
        (
            row.isFresh
                ? "TRUE"
                : "FALSE"
        ) !==
        freshFilter
    ){

        return false;

    }


    /* RUNNING TOTAL */

    if(
        !numericMatches(
            row.runningTotal,
            getFilter(
                "runningTotal"
            )
        )
    ){

        return false;

    }


    return true;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const tbody =
        document.getElementById(
            "tbody"
        );


    tbody.innerHTML = "";


    if(
        calculatedRows.length === 0
    ){

        tbody.innerHTML = `

        <tr>

            <td colspan="11">

                <div class="empty">

                    Upload the trade file

                </div>

            </td>

        </tr>

        `;


        updateSummary();

        return;

    }


    /*
       Apply all active filters.
    */

    const rows =
        calculatedRows.filter(
            row =>
                rowMatches(row)
        );


    if(
        rows.length === 0
    ){

        tbody.innerHTML = `

        <tr>

            <td colspan="11">

                <div class="empty">

                    No rows match the filter

                </div>

            </td>

        </tr>

        `;


        updateSummary();

        return;

    }


    /*
       Overall peak.
    */

    const overallPeak =
        Math.max(
            ...calculatedRows.map(
                row =>
                    row.runningTotal
            )
        );


    rows.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );


            /*
               Highlight peak row.
            */

            if(
                Math.abs(
                    row.runningTotal -
                    overallPeak
                ) < 0.000001
            ){

                tr.classList.add(
                    "peak-row"
                );

            }


            const typeClass =
                row.isFresh
                    ? "fresh"
                    : "square";


            tr.innerHTML = `

            <td>

                ${escapeHTML(
                    row.orderNo
                )}

            </td>


            <td>

                ${escapeHTML(
                    row.side
                )}

            </td>


            <td>

                <strong>

                    ${escapeHTML(
                        row.symbol
                    )}

                </strong>

            </td>


            <td>

                ${money(
                    row.qty
                )}

            </td>


            <td>

                ${money(
                    row.price
                )}

            </td>


            <td>

                ${money(
                    row.tradeValue
                )}

            </td>


            <td>

                ${money(
                    row.peakMargin
                )}

            </td>


            <td>

                ${
                    row.revisedPeakMargin === null
                        ? ""
                        : money(
                            row.revisedPeakMargin
                          )
                }

            </td>


            <td>

                ${money(
                    row.netQty
                )}

            </td>


            <td class="${typeClass}">

                ${
                    row.isFresh
                        ? "TRUE"
                        : "FALSE"
                }

            </td>


            <td>

                ${money(
                    row.runningTotal
                )}

            </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );


    updateSummary();

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

    /*
       TRADES
    */

    document.getElementById(
        "tradeCount"
    ).textContent =
        trades.length;


    /*
       SYMBOLS
    */

    const symbols =
        new Set(
            trades.map(
                trade =>
                    trade.symbol
            )
        );


    document.getElementById(
        "symbolCount"
    ).textContent =
        symbols.size;


    /*
       No trades.
    */

    if(
        calculatedRows.length === 0
    ){

        document.getElementById(
            "peakMargin"
        ).textContent =
            "0.00";


        return;

    }


    /*
       Peak Margin.
    */

    const peak =
        Math.max(
            ...calculatedRows.map(
                row =>
                    row.runningTotal
            )
        );


    document.getElementById(
        "peakMargin"
    ).textContent =
        money(
            peak
        );

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        trades.length +
        " trades loaded";


    status.className =
        trades.length
            ? "status ok"
            : "status";

}


/* =========================================================
   FILTER EVENTS
========================================================= */

document
    .querySelectorAll(
        ".filter"
    )
    .forEach(
        filter => {

            filter.addEventListener(
                "input",
                render
            );


            filter.addEventListener(
                "change",
                render
            );

        }
    );


/* =========================================================
   CLEAR
========================================================= */

function clearAll(){

    trades = [];

    calculatedRows = [];

    varData = {};

    varLoaded = false;


    /*
       Clear files.
    */

    document.getElementById(
        "tradeFile"
    ).value =
        "";


    document.getElementById(
        "varFile"
    ).value =
        "";


    /*
       Disable VAR.
    */

    document.getElementById(
        "useVAR"
    ).checked =
        false;


    /*
       Trade status.
    */

    document.getElementById(
        "status"
    ).textContent =
        "No file loaded";


    document.getElementById(
        "status"
    ).className =
        "status";


    /*
       VAR status.
    */

    document.getElementById(
        "varStatus"
    ).textContent =
        "VAR: Not Loaded";


    document.getElementById(
        "varStatus"
    ).className =
        "status warn";


    /*
       Clear filters.
    */

    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            filter => {

                filter.value =
                    "";

            }
        );


    /*
       Clear table.
    */

    document.getElementById(
        "tbody"
    ).innerHTML = `

    <tr>

        <td colspan="11">

            <div class="empty">

                Upload the trade file

            </div>

        </td>

    </tr>

    `;


    updateSummary();

}

</script>
