<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position File Generator</title>

    <link rel="stylesheet" href="STYLE.css">
</head>

<body>

<div class="card">

    <div class="window">
        <div class="title-bar">
            Position Files
        </div>
    </div>

    <div class="form-row">
        <label>Client ID 1 :</label>
        <input type="text" id="client1" placeholder="Client 1 (Required)">
    </div>

    <div class="form-row">
        <label>Client ID 2 :</label>
        <input type="text" id="client2" placeholder="Client 2 (Optional)">
    </div>

    <div class="form-row">
        <label>Expiry Date :</label>
        <input type="date" id="expiry">
    </div>

    <br>

    <div id="checkboxContainer">

        <div class="checkbox-item">
            <input
                type="checkbox"
                id="all"
                onclick="toggleAll()">

            <label for="all">
                Select All
            </label>
        </div>

    </div>

    <br>

    <div class="button-row">

        <button onclick="previewFile()">
            Preview
        </button>

        <button onclick="generate()">
            Generate Files
        </button>

    </div>

</div>


<!-- ================= PREVIEW ================= -->

<div class="preview-card">

    <div class="preview-title" id="previewTitle">
        Preview
    </div>

    <div class="table-container">

        <table id="previewTable">

            <thead>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<div class="footer">
    © Khaled
</div>

<script src="POS.js"></script>

</body>
</html>
