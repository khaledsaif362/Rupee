<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Files</title>
<link rel="stylesheet" href="STYLE.css">
</head>

<body>

<div class="card">

    <div class="window">
        <div class="title-bar">
            Position Files
        </div>
    </div>
	
	
	
	<div class="form-row">
    <label for="positionType">Segment:</label>
    <select id="positionType" onchange="loadFiles()">
      <option value="FO">Derivative Position</option>
        <option value="CD">NSE Currency Position</option>
        <option value="MCX">MCX Position</option>
        <option value="NCDEX">NCDEX Position</option>
        <option value="NSECOM">NSE COM Position</option>
    </select>
</div>

<div class="form-row">
    <label for="client1">Client ID 1:</label>
    <input type="text" id="client1">
</div>

<div class="form-row">
    <label for="client2">Client ID 2:</label>
    <input type="text" id="client2">
</div>

<div class="form-row">
    <label for="expiry">Expiry Date:</label>
    <input type="date" id="expiry">
</div>
	
	
	
	

	
	
	

    

  

<div id="checkboxContainer">
</div>

    <div class="button-group">
        <button onclick="generate()">Generate File</button>
       
    </div>

  

</div>

<div class="footer">
    © Khaled
</div>

<script src="pos.js"></script>

</body>
</html>
