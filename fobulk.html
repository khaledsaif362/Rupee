<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;

}

body{

.primary{

.primary:hover{

}

.clear-btn{

}

}

.status-bar{
  display:flex;
  gap:10px;

}

.status{
  flex:1;
  height:26px;
  min-height:26px;
  padding:5px 12px;
  border-radius:6px;
  background:#edf5ee;
  color:#216634;

}

.status.ok{

}

}

.info{
  background:#fff;

  padding:0 12px;
  height:26px;
  border-radius:6px;
  display:flex;
  align-items:center;
  min-width:0;

  font-weight:900;

}

.output{
  flex:1;

  border:1.5px solid #216634;

  box-shadow:0 2px 10px rgba(33,102,52,.06);
}

table{
  width:100%;

}

th,
td{

th{

tr:nth-child(even){

    overflow:auto;

  .controls{
    grid-template-columns:repeat(2,1fr);
  }

  .output{
    height:calc(100vh - 240px);
    flex:none;
  }
}
</style>

<body>

<div class="controls">

</div>


<div class="status-bar">

    id="status"

</div>

  id="output"

>
  <div class="empty">

<script>
"use strict";


/* =========================================================
   SERVER BHAVCOPY API
   ========================================================= */

const BHAVCOPY_API =
  "http://172.16.101.74:8090/api/nse-fo-bhavcopy";


/* =========================================================
   EXISTING VARIABLES
   ========================================================= */

const HEAD=[
  "",
  "Exch",
  "EXCH_SEG",
  "SegmentCode",
  "Symbol",
  "ClientID",
  "Buy/Sell",
  "Token",
  "Product",
  "Qty",
  "Price",
  "OrdType",
  "Trigger Price",
  "DQty",
  "Val",
  "Pro/Cli",
  "Participant ID",
  "LTP"
];

let contracts=[];
let rowsOut=[];
let fileClients=[];


const $=id=>document.getElementById(id);

const status=$("status");
const summary=$("summary");
const output=$("output");


/* =========================================================
   COMMON FUNCTIONS
   ========================================================= */

function clean(v){
  return String(v??"")
    .replace(/^\uFEFF/,"")
    .trim();
}


function msg(t,c=""){
  status.textContent=t;
  status.className="status "+c;
}


function num(v){

  let x=clean(v).replace(/,/g,"");

  if(!x)
    return null;

  let n=Number(x);

  return Number.isFinite(n)
    ? n
    : null;
}


/* =========================================================
   CSV PARSER
   ========================================================= */

function csvParse(text){

  text=String(text||"")
    .replace(/^\uFEFF/,"");

  let out=[];
  let row=[];
  let cell="";
  let q=false;

  for(let i=0;i<text.length;i++){

    let ch=text[i];

    if(q){

      if(ch==='"'){

        if(text[i+1]==='"'){
          cell+='"';
          i++;
        }else{
          q=false;
        }

      }else{

        cell+=ch;

      }

    }else if(ch==='"'){

      q=true;

    }else if(ch===','){

      row.push(cell);
      cell="";

    }else if(ch==='\n'){

      row.push(cell);

      if(row.some(v=>clean(v)!==""))
        out.push(row);

      row=[];
      cell="";

    }else if(ch!=='\r'){

      cell+=ch;

    }
  }


  if(cell!=="" || row.length){

    row.push(cell);

    if(row.some(v=>clean(v)!==""))
      out.push(row);

  }


  if(!out.length)
    return [];


  const h=out[0].map(clean);


  return out.slice(1).map(r=>{

    let o={};

    h.forEach((k,i)=>{
      o[k]=r[i]??"";
    });

    return o;

  });

}


/* =========================================================
   FUTURE / OPTION DETECTION
   ========================================================= */

function isFuture(r){

  let t=clean(r.FinInstrmTp).toUpperCase();

  if(t==="STF" || t==="IDF")
    return true;

  return clean(r.OptnTp).toUpperCase()==="FUT";
}


function isOption(r){

  let o=clean(r.OptnTp).toUpperCase();

  if(o==="CE" || o==="PE")
    return true;

  let t=clean(r.FinInstrmTp).toUpperCase();

  return t==="STO" || t==="IDO";
}


/* =========================================================
   READ CONTRACTS
   EXISTING LOGIC PRESERVED
   ========================================================= */

function readContracts(data){

  const need=[
    "FinInstrmTp",
    "TckrSymb",
    "FinInstrmNm",
    "XpryDt",
    "StrkPric",
    "OptnTp",
    "FinInstrmId",
    "ClsPric",
    "NewBrdLotQty"
  ];


  if(!data.length)
    throw Error("Bhavcopy is empty.");


  let miss=need.filter(
    k=>!(k in data[0])
  );


  if(miss.length)
    throw Error(
      "Invalid NSE Bhavcopy. Missing: "+
      miss.join(", ")
    );


  let seen=new Set();
  let a=[];


  for(const r of data){

    if(!(isFuture(r)||isOption(r)))
      continue;


    let id=clean(r.FinInstrmId);
    let name=clean(r.FinInstrmNm);

    let lot=num(r.NewBrdLotQty);
    let ltp=num(r.ClsPric);


    if(!id || !name || lot===null || ltp===null)
      continue;


    let key=id+"|"+name;


    if(seen.has(key))
      continue;


    seen.add(key);


    a.push({

      TckrSymb:
        clean(r.TckrSymb),

      FinInstrmNm:
        name,

      FinInstrmId:
        id,

      XpryDt:
        clean(r.XpryDt),

      StrkPric:
        num(r.StrkPric),

      OptnTp:
        isFuture(r)
          ? "FUT"
          : clean(r.OptnTp).toUpperCase(),

      ClsPric:
        ltp,

      NewBrdLotQty:
        lot

    });

  }


  return a;
}


/* =========================================================
   CLIENTS
   ========================================================= */

function clients(){

  let a=[
    clean($("client1").value),
    clean($("client2").value),
    ...fileClients
  ].filter(Boolean);


  return [...new Set(a)];
}


/* =========================================================
   CLIENT FILE
   ========================================================= */

$("clientFile").addEventListener(
  "change",
  async()=>{

    let f=$("clientFile").files[0];

    if(!f){

      fileClients=[];

      return;
    }


    try{

      let text=await f.text();


      let vals=text
        .replace(/\r/g,"")
        .split(/[\n,\t;]+/)
        .map(clean)
        .filter(Boolean);


      fileClients=[
        ...new Set(
          vals.filter(
            v=>![
              "CLIENT",
              "CLIENTID",
              "CLIENT ID",
              "CLIENTCODE",
              "CLIENT CODE"
            ].includes(v.toUpperCase())
          )
        )
      ];


      msg(
        "✓ "+fileClients.length+
        " client IDs loaded.",
        "ok"
      );


    }catch(e){

      fileClients=[];

      msg(
        "✗ Could not read client file.",
        "err"
      );

    }

  }
);


/* =========================================================
   PRODUCTS
   ========================================================= */

function products(){

  return [
    ...document.querySelectorAll(
      "#products input:checked"
    )
  ].map(x=>x.value);

}


/* =========================================================
   ORDER TYPES
   ========================================================= */

function orderTypes(){

  return [
    ...document.querySelectorAll(
      "#orders input:checked"
    )
  ].map(x=>x.value);

}


/* =========================================================
   ORDER CREATION
   EXISTING LOGIC PRESERVED
   ========================================================= */

function order(c,cl,side,prod,type){

  let p=0;
  let t=0;

  let close=Number(c.ClsPric);


  if(type==="Limit")
    p=close.toFixed(2);


  if(type==="SL"){

    p=close.toFixed(2);

    t=(
      side==="BUY"
        ? close-2
        : close+2
    ).toFixed(2);

  }


  if(type==="SL-M"){

    t=(
      side==="BUY"
        ? close-2
        : close+2
    ).toFixed(2);

  }


  return {

    "":"",
    "Exch":"NSE",
    "EXCH_SEG":"NSED",
    "SegmentCode":"D",

    "Symbol":
      c.FinInstrmNm,

    "ClientID":
      cl,

    "Buy/Sell":
      side,

    "Token":
      c.FinInstrmId,

    "Product":
      prod,

    "Qty":
      c.NewBrdLotQty,

    "Price":
      p,

    "OrdType":
      type,

    "Trigger Price":
      t,

    "DQty":
      "0",

    "Val":
      "DAY",

    "Pro/Cli":
      "C",

    "Participant ID":
      "",

    "LTP":
      Number(c.ClsPric).toFixed(2)

  };

}


/* =========================================================
   RANDOM ORDERS
   EXISTING LOGIC PRESERVED
   ========================================================= */

function randomOrders(list,n){

  const cls=clients();
  const ps=products();
  const ots=orderTypes();

  const requestedSide=$("side").value;


  if(!cls.length)
    throw Error(
      "Enter Client 1/2 or upload a Client CSV/TXT."
    );


  if(!ps.length)
    throw Error(
      "Select at least one Product."
    );


  if(!ots.length)
    throw Error(
      "Select at least one Order Type."
    );


  if(!list.length)
    throw Error(
      "No valid contracts available."
    );


  const sideMap=new Map();
  const result=[];


  for(let i=0;i<n;i++){

    const c=
      list[
        Math.floor(
          Math.random()*list.length
        )
      ];


    const cl=
      cls[
        Math.floor(
          Math.random()*cls.length
        )
      ];


    const key=
      cl+"|"+c.TckrSymb;


    let sd;


    if(requestedSide==="RANDOM"){

      if(!sideMap.has(key)){

        sideMap.set(
          key,
          Math.random()<.5
            ? "BUY"
            : "SELL"
        );

      }


      sd=sideMap.get(key);

    }else{

      sd=requestedSide;

    }


    const pr=
      ps[
        Math.floor(
          Math.random()*ps.length
        )
      ];


    const ot=
      ots[
        Math.floor(
          Math.random()*ots.length
        )
      ];


    result.push(
      order(
        c,
        cl,
        sd,
        pr,
        ot
      )
    );

  }


  return result;
}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function esc(v){

  return String(v).replace(
    /[&<>"']/g,
    x=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[x])
  );

}


/* =========================================================
   RENDER OUTPUT
   ========================================================= */

function render(){

  if(!rowsOut.length){

    output.innerHTML=
      '<div class="empty">'+
      'Generated output will appear here.'+
      '</div>';

    return;
  }


  let h=
    "<table>"+
    "<thead>"+
    "<tr>"+
    HEAD.map(
      x=>"<th>"+esc(x)+"</th>"
    ).join("")+
    "</tr>"+
    "</thead>"+
    "<tbody>";


  for(const r of rowsOut){

    h+=
      "<tr>"+
      HEAD.map(
        x=>"<td>"+
        esc(r[x]??"")+
        "</td>"
      ).join("")+
      "</tr>";

  }


  output.innerHTML=
    h+
    "</tbody>"+
    "</table>";

}


/* =========================================================
   LOAD BHAVCOPY DIRECTLY FROM GO SERVER
   ========================================================= */

async function loadServerBhavcopy(){

  try{

    msg(
      "Loading NSE FO Bhavcopy from server..."
    );


    const response=
      await fetch(BHAVCOPY_API);


    if(!response.ok){

      throw new Error(
        "Server returned HTTP "+
        response.status
      );

    }


    const csvText=
      await response.text();


    if(!csvText.trim()){

      throw new Error(
        "Bhavcopy returned empty."
      );

    }


    const data=
      csvParse(csvText);


    contracts=
      readContracts(data);


    const fu=
      contracts.filter(
        isFuture
      ).length;


    const op=
      contracts.filter(
        isOption
      ).length;


    if(!fu || !op){

      throw Error(
        "Bhavcopy must contain both Futures and Options."
      );

    }


    summary.textContent=
      data.length.toLocaleString()+
      " rows • "+
      contracts.length.toLocaleString()+
      " contracts • "+
      fu+
      " FUT / "+
      op+
      " OPT";


    msg(
      "✓ NSE FO Bhavcopy loaded from server.",
      "ok"
    );


  }catch(e){

    contracts=[];

    summary.textContent=
      "Bhavcopy load failed.";


    msg(
      "✗ "+e.message,
      "err"
    );

  }

}


/* =========================================================
   GENERATE
   EXISTING 80% FUT / 20% OPT LOGIC
   ========================================================= */

$("generate").addEventListener(
  "click",
  ()=>{

    try{

      if(!contracts.length)
        throw Error(
          "Load Bhavcopy first."
        );


      const n=
        parseInt(
          $("recordCount").value,
          10
        );


      if(!Number.isInteger(n)||n<1)
        throw Error(
          "Enter a valid record count."
        );


      const cls=clients();


      if(!cls.length)
        throw Error(
          "Enter Client 1/2 or upload a Client CSV/TXT."
        );


      const fut=
        contracts.filter(
          isFuture
        );


      const opt=
        contracts.filter(
          isOption
        );


      if(!fut.length||!opt.length)
        throw Error(
          "Bhavcopy must contain both Futures and Options."
        );


      /* 80% FUTURE */
      const fn=
        Math.round(n*.80);


      /* Remaining 20% OPTIONS */
      const on=
        n-fn;


      const futureRows=
        randomOrders(
          fut,
          fn
        );


      const optionRows=
        randomOrders(
          opt,
          on
        );


      rowsOut=
        futureRows.concat(
          optionRows
        );


      /* Shuffle */
      for(
        let i=rowsOut.length-1;
        i>0;
        i--
      ){

        const j=
          Math.floor(
            Math.random()*(i+1)
          );


        [
          rowsOut[i],
          rowsOut[j]
        ]=[
          rowsOut[j],
          rowsOut[i]
        ];

      }


      render();


      summary.textContent=
        "Generated "+
        n.toLocaleString()+
        " rows • "+
        fn+
        " FUT / "+
        on+
        " OPT • "+
        cls.length+
        " Clients •";


      msg(
        "✓ Generated successfully",
        "ok"
      );


    }catch(e){

      msg(
        "✗ "+e.message,
        "err"
      );

    }

  }
);


/* =========================================================
   DOWNLOAD
   ========================================================= */

$("download").addEventListener(
  "click",
  ()=>{

    if(!rowsOut.length){

      msg(
        "✗ No generated data to download.",
        "err"
      );

      return;
    }


    function ce(v){

      let x=String(v??"");


      return /[",\r\n]/.test(x)
        ? '"'+
          x.replace(/"/g,'""')+
          '"'
        : x;

    }


    let csv=
      HEAD.map(ce).join(",")+
      "\r\n"+
      rowsOut
        .map(
          r=>HEAD
            .map(
              h=>ce(r[h])
            )
            .join(",")
        )
        .join("\r\n");


    let a=
      document.createElement("a");


    let u=
      URL.createObjectURL(
        new Blob(
          [
            "\uFEFF"+csv
          ],
          {
            type:
              "text/csv;charset=utf-8"
          }
        )
      );


    a.href=u;

    a.download=
      "FO_BULK_generated.csv";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>URL.revokeObjectURL(u),
      1000
    );


    msg(
      "✓ FO_BULK_generated.csv downloaded.",
      "ok"
    );

  }
);


/* =========================================================
   CLEAR
   ========================================================= */

$("clear").addEventListener(
  "click",
  ()=>{

    rowsOut=[];


    $("output").innerHTML=
      '<div class="empty">'+
      'Generated output will appear here.'+
      '</div>';


    $("summary").textContent=
      contracts.length
        ? "Bhavcopy loaded."
        : "No Bhavcopy loaded.";


    msg(
      contracts.length
        ? "✓ Ready to generate again."
        : "Load NSE FO Bhavcopy to begin.",
      ""
    );

  }
);


/* =========================================================
   AUTO LOAD SERVER BHAVCOPY
   ========================================================= */

loadServerBhavcopy();

</script>
