<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RS Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f8f5;font-family:Arial,sans-serif}
.box{width:360px;background:#fff;border:1px solid #d7e5da;border-radius:14px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h2{text-align:center;margin:0 0 25px;color:#1f472b}
label{display:block;margin:14px 0 7px;font-weight:bold;color:#294632}
input{width:100%;height:44px;padding:0 12px;border:1px solid #b9cbbd;border-radius:8px;font-size:15px}
button{width:100%;height:44px;margin-top:22px;border:0;border-radius:8px;background:#2e7d46;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#msg{text-align:center;margin-top:15px;min-height:20px;font-size:14px}
.err{color:#b3261e}.ok{color:#23723a}
</style>
</head>
<body>
<div class="box">
<h2>RS Login</h2>
<form id="loginForm">
<label>Username</label>
<input id="username" autocomplete="username" required>
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">LOGIN</button>
<div id="msg"></div>
</form>
</div>
<script>
const API="https://rs-d1-api.saif362.workers.dev";
const next=new URLSearchParams(location.search).get("next")||"index.html";
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("loginBtn"),msg=document.getElementById("msg");
 btn.disabled=true; msg.className=""; msg.textContent="Checking...";
 try{
  const r=await fetch(API+"/api/login",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    username:document.getElementById("username").value.trim(),
    password:document.getElementById("password").value
   })
  });
  const data=await r.json();
  if(!r.ok||!data.success)throw new Error(data.error||"Invalid username or password");
  sessionStorage.setItem("rs_authenticated","1");
  sessionStorage.setItem("rs_username",data.username||"");
  msg.className="ok";msg.textContent="Login successful";
  setTimeout(()=>{location.replace(next)},300);
 }catch(err){msg.className="err";msg.textContent=err.message}
 finally{btn.disabled=false}
});
</script>
</body>
</html>
